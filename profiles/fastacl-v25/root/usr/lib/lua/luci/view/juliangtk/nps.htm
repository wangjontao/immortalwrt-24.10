<%+juliangtk/header%>
<style>.tk-nps{max-width:760px;background:#fff;padding:24px;border:1px solid #e4e8ef;border-radius:14px}.tk-nps label{display:block;margin:16px 0}.tk-nps input:not([type=checkbox]),.tk-nps select{display:block;width:100%;margin-top:6px}.tk-nps .note{color:#788397}</style>
<h2>NPS 远程维护</h2><p>此页面仅限 root 管理员访问。服务器支持域名；开机自动核对物理 WAN MAC 并生成 VKey。</p><div class="tk-nps"><p id="nps-state">读取状态…</p><form id="nps-form"><label><input type="checkbox" id="nps-enabled"> 启用 NPS</label><label>服务器地址<input id="nps-server" required maxlength="253"></label><label>服务器端口<input id="nps-port" type="number" min="1" max="65535" required></label><label>连接协议<select id="nps-protocol"><option value="tcp">TCP</option><option value="kcp">KCP</option></select></label><label>VKey<input id="nps-key" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"></label><p class="note" id="nps-key-state"></p><label><input id="nps-compress" type="checkbox"> 启用压缩</label><label><input id="nps-crypt" type="checkbox"> 启用加密</label><button class="cbi-button-apply" type="submit" id="nps-save">保存并应用</button><p id="nps-msg" role="status"></p></form></div>
<script>
(function(){'use strict';const base='<%=luci.dispatcher.build_url("admin")%>',token='<%=token%>',el=id=>document.getElementById('nps-'+id);let busy=false;
async function load(){const r=await fetch(base+'/juliangtk_nps_status');const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'状态读取失败');const c=j.config;el('state').textContent=j.running?'NPS 核心运行中':'NPS 核心未运行';el('enabled').checked=c.enabled==='1';el('server').value=c.server_addr||'';el('port').value=c.server_port||8024;el('protocol').value=c.protocol||'tcp';el('compress').checked=c.compress==='1';el('crypt').checked=c.crypt==='1';el('key-state').textContent=c.key_configured?'已配置 VKey，留空保持原值。':'尚未配置 VKey。';}
el('form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!confirm('保存后 NPS 会重新连接服务器，现有远程维护连接可能短暂中断。继续？'))return;busy=true;el('save').disabled=true;try{const data={enabled:el('enabled').checked,server_addr:el('server').value.trim(),server_port:Number(el('port').value),protocol:el('protocol').value,vkey:el('key').value,compress:el('compress').checked,crypt:el('crypt').checked};const r=await fetch(base+'/juliangtk_nps_save',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({token,data:JSON.stringify(data)})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'保存失败');el('key').value='';el('msg').textContent='已保存，NPS 正在重新连接。';setTimeout(()=>load().catch(e=>el('msg').textContent=e.message),2000);}catch(e){el('msg').textContent=e.message;}finally{busy=false;el('save').disabled=false;}};
load().catch(e=>el('msg').textContent=e.message);
})();
</script><%+juliangtk/footer%>
