<style>.jl-egress{background:linear-gradient(115deg,#f0f7ff 0%,#f7f9ff 55%,#fff 100%);border-color:#dce8fb}
.jl-egress-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.jl-egress-head h3{margin:0;font-weight:750;color:#425776}.jl-egress-head button{flex:0 0 auto;min-width:132px;width:auto!important;height:auto!important;min-height:42px;white-space:nowrap!important;line-height:1.4!important;display:inline-flex;align-items:center;justify-content:center;border:1px solid #ceddf6;border-radius:10px;padding:9px 16px;background:#fff;color:#2463cd;font-weight:650;cursor:pointer}.jl-egress-head button:disabled{opacity:.6}
.jl-egress-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap}#egress-ip{font-size:36px;font-weight:800;color:#0768df;line-height:1.25;letter-spacing:-.6px;overflow-wrap:anywhere}.jl-country{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #e0e8f6;border-radius:12px;padding:8px 13px;font-size:16px;font-weight:700;color:#304563}.jl-country img{width:36px;height:24px;object-fit:cover;border-radius:3px;box-shadow:0 1px 4px #0002}.jl-country img[hidden]{display:none}
.jl-egress-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;color:#5a6c87;font-size:13px}.jl-egress-meta span:not(:empty){padding:5px 10px;background:#eaf1fc;border-radius:7px}.jl-egress-note{margin:14px 0 0;font-size:12px;color:#8391a6;line-height:1.6}@media(max-width:600px){#egress-ip{font-size:28px}.jl-egress-main{gap:10px}}
</style>
  <div class="jo-card jl-egress" style="margin:18px 0">
    <div class="jl-egress-head"><h3>实际出口 IP</h3><button type="button" id="egress-refresh">检测 / 刷新</button></div>
    <div class="jl-egress-main"><span id="egress-ip">待检测</span><span class="jl-country"><img id="egress-flag" alt="" hidden><span id="egress-country">--</span></span></div>
    <div class="jl-egress-meta"><span id="egress-location">等待检测</span><span id="egress-isp"></span><span id="egress-time"></span></div>
    <p class="jl-egress-note">路由器自身出口 · 来源 ipwho.is · 地理位置为数据库归属地；手机代理出口请在对应手机上检测。</p>
  </div>

<script>(function(){const egressApi='<%=url("admin/juliang_egress")%>';
async function detectEgress(){
 let b=document.getElementById('egress-refresh'),flag=document.getElementById('egress-flag');b.disabled=true;document.getElementById('egress-ip').textContent='检测中…';flag.hidden=true;
 try{let r=await fetch(egressApi,{cache:'no-store'});if(!r.ok)throw Error('请求失败 '+r.status);let d=await r.json();if(!d.ok)throw Error(d.error||'检测失败');
 document.getElementById('egress-ip').textContent=d.ip;let code=(d.country_code||'').toUpperCase();
 document.getElementById('egress-country').textContent=d.country||code||'未知地区';
 if(/^[A-Z]{2}$/.test(code)){flag.alt=(d.country||code)+' 国旗';flag.onload=()=>{flag.hidden=false;};flag.onerror=()=>{flag.hidden=true;};flag.src='https://flagcdn.com/'+code.toLowerCase()+'.svg';}
 let location=[d.region,d.city].filter((v,i,a)=>v&&v!==d.country&&a.indexOf(v)===i);
 document.getElementById('egress-location').textContent=location.join(' · ')||d.country||'未知地区';
 document.getElementById('egress-isp').textContent=d.isp||'';document.getElementById('egress-time').textContent='检测于 '+new Date(d.checked_at*1000).toLocaleTimeString();
 }catch(e){document.getElementById('egress-ip').textContent='检测失败';document.getElementById('egress-location').textContent=e.message;document.getElementById('egress-country').textContent='--';document.getElementById('egress-isp').textContent='';document.getElementById('egress-time').textContent='';}finally{b.disabled=false;}}
document.getElementById('egress-refresh').addEventListener('click',detectEgress);
detectEgress();})();</script>
