<%+header%>
<style>
.f252{max-width:1500px;margin:auto;padding:0 4px 24px}.f252 *{box-sizing:border-box}.f252 h2{margin:4px 0;font-size:27px}.f252 h3{margin:0 0 10px}.f252 .sub,.f252 .note,.f252 .meta{opacity:.68}.f252 .note,.f252 .meta{font-size:12px;line-height:1.5}.f252 .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.f252 .card{border:1px solid rgba(120,120,120,.2);border-radius:12px;padding:16px;margin:12px 0;background:var(--background-color,#fff)}.f252 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.f252 .item{border:1px solid rgba(120,120,120,.17);border-radius:10px;padding:12px}.f252 .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.f252 .title{font-weight:700;word-break:break-all}.f252 .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.f252 .field label{display:block;font-size:12px;opacity:.68;margin-bottom:3px}.f252 input,.f252 select,.f252 textarea{max-width:100%;min-height:37px}.f252 .field input,.f252 .field select{width:100%}.f252 textarea{width:100%;min-height:120px;resize:vertical}.f252 .wide{grid-column:1/-1}.f252 .msg{white-space:pre-wrap;font-weight:600;margin:8px 0}.f252 .good{color:#159957}.f252 .bad{color:#d74646}.f252 .pill{padding:3px 8px;border-radius:999px;background:rgba(80,100,220,.1);font-size:12px}.f252 .danger{color:#c43131}.f252 .hidden{display:none!important}.f252 .modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:18px}.f252 .modalbox{width:min(700px,96vw);max-height:90vh;overflow:auto;background:var(--background-color,#fff);padding:20px;border-radius:12px}.f252 .modalnode{padding:10px;border-radius:8px;background:rgba(80,100,220,.08);font-weight:700;margin-bottom:12px}.f252 .check{display:flex;align-items:center;gap:7px}.f252 .check input{min-height:auto}.f252 button{cursor:pointer}.f252 details>summary{cursor:pointer;font-weight:700}
@media(max-width:640px){.f252 .grid,.f252 .fields{grid-template-columns:1fr}.f252 .wide{grid-column:auto}.f252 .bar>*{flex:1 1 100%;width:100%}.f252 .card{padding:12px}.f252 h2{font-size:23px}}
</style>
<div class="f252">
  <h2>JuLiangTK · FastACL 2.5.2 Lite</h2>
  <div class="sub">dae/eBPF · 应用层快速切换 · 普通换节点不重载 network / WiFi / firewall</div>
  <div class="bar"><span id="f25-health">读取状态…</span><button class="cbi-button" id="f25-refresh">刷新</button><input id="f25-search" placeholder="搜索设备 / MAC / IP"></div>
  <div id="f25-msg" class="msg" role="status"></div>

  <div class="card">
    <div class="head"><h3>节点</h3><span id="f25-node-count" class="pill">0</span></div>
    <div class="bar"><button class="cbi-button cbi-button-add" id="f25-import-open">+ 导入节点</button><button class="cbi-button" id="f25-select-all">全选</button><button class="cbi-button danger" id="f25-delete-selected">删除所选</button><button class="cbi-button" id="f25-clear-selected">清空选择</button><span id="f25-selected-count" class="pill">已选 0</span></div>
    <div id="f25-import-box" class="hidden"><textarea id="f25-links" placeholder="每行一个 SOCKS5 / HTTP / VLESS / VMess / Trojan / SS / Hysteria2 / TUIC"></textarea><div class="bar"><button class="cbi-button cbi-button-add" id="f25-import">导入</button><button class="cbi-button" id="f25-import-close">收起</button></div></div>
    <div id="f25-node-list" class="grid"></div>
  </div>

  <div class="card">
    <div class="head"><h3>设备分配（主 WiFi）</h3><span class="pill">Lite 热路径</span></div>
    <div class="bar"><select id="f25-batch-node"></select><select id="f25-batch-pre"></select><button class="cbi-button cbi-button-apply" id="f25-batch">应用到勾选设备</button><button class="cbi-button" id="f25-unbind">解除勾选绑定</button></div>
    <div id="f25-devices" class="grid"></div>
  </div>

  <div class="card">
    <div class="head"><h3>附加 WiFi</h3><span id="f25-wifi-count" class="pill">0</span></div>
    <p class="note">已有 WiFi 换节点：热切换；新建/删除 WiFi：拓扑冷路径。</p>
    <div class="fields">
      <div class="field"><label>5GHz 数量</label><input id="f25-w5" type="number" min="0" value="0"></div>
      <div class="field"><label>2.4GHz 数量</label><input id="f25-w2" type="number" min="0" value="0"></div>
      <div class="field"><label>SSID 前缀</label><input id="f25-wprefix" value="A"></div>
      <div class="field"><label>起始编号</label><input id="f25-wstart" type="number" min="1" value="1"></div>
      <div class="field wide"><label>密码</label><input id="f25-wkey" type="password" value="a1111111"></div>
      <div class="field"><label>节点</label><select id="f25-wnode"></select></div>
      <div class="field"><label>前置</label><select id="f25-wpre"></select></div>
      <div class="field"><label>DNS</label><select id="f25-wdns"></select></div>
      <div class="field"><label>SSID</label><select id="f25-whidden"><option value="0">显示</option><option value="1">隐藏</option></select></div>
    </div>
    <div class="bar"><button class="cbi-button cbi-button-add" id="f25-wcreate">批量建立 WiFi</button><button class="cbi-button" id="f25-hide-all">一键隐藏所有 WiFi</button><button class="cbi-button" id="f25-show-all">恢复显示所有 WiFi</button></div>
    <div id="f25-wifis" class="grid"></div>
  </div>

  <div class="card">
    <h3>全局 DNS</h3>
    <div class="fields"><div class="field"><label>国内直连 DNS</label><select id="f25-direct-dns"></select></div><div class="field"><label>代理 DNS</label><select id="f25-proxy-dns"></select></div></div>
    <div class="bar"><button class="cbi-button cbi-button-apply" id="f25-dns-save">保存 DNS</button></div>
  </div>

  <div class="card"><details><summary>机场订阅</summary><div class="bar"><input id="f25-sub-name" placeholder="名称"><input id="f25-sub-url" type="password" placeholder="HTTPS 订阅地址"><select id="f25-sub-hours"><option value="24">24h</option><option value="12">12h</option><option value="6">6h</option><option value="1">1h</option></select><button class="cbi-button cbi-button-add" id="f25-sub-add">添加订阅</button><button class="cbi-button" id="f25-sub-update">更新全部</button></div><div id="f25-sub-list"></div></details></div>

  <div id="f25-assign-modal" class="modal hidden"><div class="modalbox"><h3>快速分配节点</h3><div id="f25-assign-node" class="modalnode"></div><div class="fields"><div class="field wide"><label>目标类型</label><select id="f25-assign-type"><option value="wifi">附加 WiFi</option><option value="device">主 WiFi 设备</option></select></div><div class="field wide"><label>目标</label><select id="f25-assign-target"></select></div><div class="field"><label>前置代理</label><select id="f25-assign-pre"></select></div><div class="field"><label>DNS</label><select id="f25-assign-dns"></select></div></div><p id="f25-assign-note" class="note"></p><div class="bar"><button class="cbi-button cbi-button-apply" id="f25-assign-go">立即分配</button><button class="cbi-button danger" id="f25-assign-unbind">解除目标绑定</button><button class="cbi-button" id="f25-assign-close">关闭</button></div></div></div>
</div>
<script>
(function(){'use strict';
const base='<%=luci.dispatcher.build_url("admin","services")%>',token='<%=token%>',$=x=>document.getElementById('f25-'+x);
let state=null,busy=false,rows=[],selected=new Set(),assignNode=null;
function msg(t,b){$('msg').textContent=t||'';$('msg').className='msg '+(b?'bad':'good')}
async function api(name,data){const o=data?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({token},data))}:{};const r=await fetch(base+'/fastacl252_'+name,o);let j;try{j=await r.json()}catch(e){throw Error('HTTP '+r.status+' 返回异常')}if(!r.ok)throw Error('HTTP '+r.status);if(!j.ok)throw Error((j.error||'操作失败')+(j.detail?'\n'+j.detail:''));return j}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function opt(s,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o)}
function nodeSel(v,pre){const s=document.createElement('select');opt(s,'',pre?'不使用前置':'国内直连');(state.nodes||[]).forEach(n=>opt(s,n.id,n.name));s.value=v||'';return s}
function dnsSel(mode,v,custom){const s=document.createElement('select');opt(s,'inherit','跟随全局 DNS');(state.dns_catalog||[]).filter(x=>x.scope===(mode==='proxy'?'proxy':'direct')).forEach(x=>opt(s,x.id,x.label));if(custom)opt(s,'custom','自定义 DNS');s.value=v||'inherit';if(!s.value)s.value='inherit';return s}
function field(name,c,wide){const d=el('div','field'+(wide?' wide':''));d.append(el('label','',name),c);return d}
function health(){const r=state.runtime||{};$('health').textContent=(state.enabled?'已启用':'未启用')+' · 核心 '+(r.engine||'stopped')+' · 防火墙 '+(r.firewall?'正常':'未加载')+(r.switch&&r.switch!=='none'?' · '+r.switch:'')+' · '+state.version}
function renderBatch(){const a=nodeSel('',false),b=nodeSel('',true);$('batch-node').replaceChildren(...a.childNodes);$('batch-pre').replaceChildren(...b.childNodes)}
function renderNodes(){const known=new Set((state.nodes||[]).map(n=>n.id));[...selected].forEach(x=>{if(!known.has(x))selected.delete(x)});$('node-count').textContent=(state.nodes||[]).length+' 个节点';$('node-list').replaceChildren();(state.nodes||[]).forEach(n=>{const box=el('div','item'),h=el('div','head'),lab=el('label','check'),ck=document.createElement('input');ck.type='checkbox';ck.checked=selected.has(n.id);lab.append(ck,el('span','title',n.name));h.append(lab,el('span','pill',n.protocol||''));const a=el('div','bar'),q=el('button','cbi-button cbi-button-apply','快速分配'),d=el('button','cbi-button danger','删除');a.append(q,d);box.append(h,a);$('node-list').append(box);ck.onchange=()=>{ck.checked?selected.add(n.id):selected.delete(n.id);$('selected-count').textContent='已选 '+selected.size};q.onclick=()=>openAssign(n);d.onclick=async()=>{if(!confirm('删除 '+n.name+'？'))return;try{await api('delete_node',{id:n.id});selected.delete(n.id);await load();msg('节点已删除')}catch(e){msg(e.message,true)}}});$('selected-count').textContent='已选 '+selected.size}
function devicePayload(r){return{mac:r.d.mac,name:r.name.value,ip:r.ip.value,node:r.node.value,preproxy:r.node.value?r.pre.value:'',dns:r.dns.value}}
function renderDevices(){rows=[];$('devices').replaceChildren();const q=$('search').value.toLowerCase();(state.devices||[]).filter(d=>[d.name,d.mac,d.ip,d.fixed_ip].join(' ').toLowerCase().includes(q)).forEach(d=>{const box=el('div','item'),h=el('div','head'),left=el('div'),ck=document.createElement('input');ck.type='checkbox';left.append(el('div','title',d.name||d.mac),el('div','meta',d.mac+' · '+(d.online?'在线':'离线')));h.append(left,ck);const f=el('div','fields'),name=document.createElement('input'),ip=document.createElement('input'),node=nodeSel(d.mode==='proxy'?d.node:'',false),pre=nodeSel(d.preproxy||'',true),dns=dnsSel(d.mode==='proxy'?'proxy':'direct',d.dns||'inherit',false);name.value=d.name||'';ip.value=d.fixed_ip||d.ip||'';f.append(field('名称',name),field('固定 IP',ip),field('出口节点',node),field('前置',pre),field('DNS',dns,true));const save=el('button','cbi-button cbi-button-apply','快速保存'),bar=el('div','bar');bar.append(save);box.append(h,f,bar);$('devices').append(box);const r={d,ck,name,ip,node,pre,dns};node.onchange=()=>{const s=dnsSel(node.value?'proxy':'direct','inherit',false);dns.replaceWith(s);r.dns=s};save.onclick=()=>store({devices:[devicePayload(r)]});rows.push(r)});if(!rows.length)$('devices').append(el('div','note','没有匹配设备'))}
function wifiPayload(w,node,pre,dns){return{action:'update',id:w.id,node:node.value,preproxy:node.value?pre.value:'',dns:dns.value}}
function renderWifiCreate(){const n=nodeSel('',false),p=nodeSel('',true);$('wnode').replaceChildren(...n.childNodes);$('wpre').replaceChildren(...p.childNodes);const fill=()=>{const d=dnsSel($('wnode').value?'proxy':'direct','inherit',false);$('wdns').replaceChildren(...d.childNodes)};$('wnode').onchange=fill;fill()}
function renderWifis(){const inf=state.wifi||{managed:[],counts:{'5g':0,'2g':0},max5:14,max2:8};$('wifi-count').textContent='5G '+(inf.counts['5g']||0)+'/'+inf.max5+' · 2.4G '+(inf.counts['2g']||0)+'/'+inf.max2;$('wifis').replaceChildren();(inf.managed||[]).forEach(w=>{const box=el('div','item'),h=el('div','head'),left=el('div');left.append(el('div','title',w.ssid||w.id),el('div','meta',w.subnet+' · '+w.band));h.append(left);const f=el('div','fields'),node=nodeSel(w.mode==='proxy'?w.node:'',false),pre=nodeSel(w.preproxy||'',true),dns=dnsSel(w.mode==='proxy'?'proxy':'direct',w.dns||'inherit',false);f.append(field('出口节点',node),field('前置',pre),field('DNS',dns,true));const bar=el('div','bar'),save=el('button','cbi-button cbi-button-apply','快速切换'),del=el('button','cbi-button danger','删除 WiFi');bar.append(save,del);box.append(h,f,bar);$('wifis').append(box);node.onchange=()=>{const s=dnsSel(node.value?'proxy':'direct','inherit',false);dns.replaceWith(s)};save.onclick=()=>wifi(wifiPayload(w,node,pre,dns));del.onclick=()=>confirm('删除 '+w.ssid+'？')&&wifi({action:'remove',id:w.id})});renderWifiCreate()}
function renderDns(){for(const [id,scope,val] of [['direct-dns','direct',state.direct_dns],['proxy-dns','proxy',state.proxy_dns]]){const s=$(id);s.replaceChildren();(state.dns_catalog||[]).filter(x=>x.scope===scope).forEach(x=>opt(s,x.id,x.label));s.value=val||''}}
function renderSubs(){$('sub-list').replaceChildren();(state.subscriptions||[]).forEach(s=>{const b=el('div','bar'),t=el('span','',s.name+' · '+s.interval_hours+'h'),u=el('button','cbi-button','更新'),d=el('button','cbi-button danger','删除');u.onclick=()=>sub({action:'update',id:s.id});d.onclick=()=>confirm('删除订阅？')&&sub({action:'remove',id:s.id});b.append(t,u,d);$('sub-list').append(b)})}
function render(){health();renderNodes();renderBatch();renderDevices();renderWifis();renderDns();renderSubs()}
async function load(){try{state=await api('status');render()}catch(e){msg(e.message,true)}}
async function store(data){if(busy)return;busy=true;const t=performance.now();try{const j=await api('save',{data:JSON.stringify(data)});await load();msg((j.message||'完成')+' · '+((performance.now()-t)/1000).toFixed(2)+'s')}catch(e){msg(e.message,true)}finally{busy=false}}
async function wifi(data){if(busy)return;busy=true;const t=performance.now();try{const j=await api('wifi',{data:JSON.stringify(data)});await load();msg((j.message||'完成')+' · '+((performance.now()-t)/1000).toFixed(2)+'s')}catch(e){msg(e.message,true)}finally{busy=false}}
function assignTargets(){const s=$('assign-target');s.replaceChildren();if($('assign-type').value==='wifi')(state.wifi&&state.wifi.managed||[]).forEach(w=>opt(s,w.id,(w.ssid||w.id)+' · '+w.subnet));else(state.devices||[]).forEach(d=>opt(s,d.mac,(d.name||d.mac)+' · '+(d.fixed_ip||d.ip||'')));if(!s.options.length)opt(s,'','没有目标')}
function openAssign(n){assignNode=n;$('assign-node').textContent='['+(n.protocol||'').toUpperCase()+'] '+n.name;$('assign-type').value=(state.wifi&&state.wifi.managed&&state.wifi.managed.length)?'wifi':'device';assignTargets();const p=nodeSel('',true);$('assign-pre').replaceChildren(...p.childNodes);const chain=n.protocol==='socks'||n.protocol==='http';$('assign-pre').disabled=!chain;$('assign-note').textContent=chain?'SOCKS/HTTP 可选前置代理':'此协议直接作为出口';const d=dnsSel('proxy','inherit',false);$('assign-dns').replaceChildren(...d.childNodes);$('assign-modal').classList.remove('hidden')}
function closeAssign(){$('assign-modal').classList.add('hidden');assignNode=null}
async function doAssign(unbind){if(!assignNode||!$('assign-target').value){msg('没有可分配目标',true);return}const type=$('assign-type').value,target=$('assign-target').value,node=unbind?'':assignNode.id,pre=unbind?'':($('assign-pre').disabled?'':$('assign-pre').value),dns=unbind?'inherit':$('assign-dns').value;if(type==='wifi')await wifi({action:'update',id:target,node,preproxy:pre,dns});else{const d=(state.devices||[]).find(x=>x.mac===target);if(!d)return msg('设备不存在',true);await store({devices:[unbind?{mac:d.mac,remove:true}:{mac:d.mac,name:d.name||'',ip:d.fixed_ip||d.ip,node,preproxy:pre,dns}]})}closeAssign()}
async function sub(data){try{await api('subscription',{data:JSON.stringify(data)});msg(data.action==='update'?'订阅更新已启动':'订阅已保存');await load()}catch(e){msg(e.message,true)}}
$('refresh').onclick=load;$('search').oninput=()=>state&&renderDevices();$('import-open').onclick=()=>$('import-box').classList.remove('hidden');$('import-close').onclick=()=>$('import-box').classList.add('hidden');
$('import').onclick=async()=>{const links=$('links').value;if(!links.trim())return msg('请先粘贴节点',true);try{const j=await api('import',{links});$('links').value='';await load();msg('成功导入 '+j.count+' 个节点')}catch(e){msg(e.message,true)}};
$('select-all').onclick=()=>{(state.nodes||[]).forEach(n=>selected.add(n.id));renderNodes()};$('clear-selected').onclick=()=>{selected.clear();renderNodes()};$('delete-selected').onclick=async()=>{if(!selected.size)return msg('请先选择节点',true);if(!confirm('删除所选未绑定节点？正在使用的会自动跳过。'))return;try{const j=await api('delete_nodes',{data:JSON.stringify({ids:[...selected]})});selected.clear();await load();const x=(j.skipped||[]).map(v=>v.id+'：'+v.reason).join('\n');msg(j.message+(x?'\n'+x:''),(j.skipped||[]).length>0)}catch(e){msg(e.message,true)}};
$('batch').onclick=()=>{const a=rows.filter(r=>r.ck.checked);if(!a.length)return msg('请先勾选设备',true);a.forEach(r=>{r.node.value=$('batch-node').value;r.pre.value=$('batch-pre').value});store({devices:a.map(devicePayload)})};$('unbind').onclick=()=>{const a=rows.filter(r=>r.ck.checked);if(!a.length)return msg('请先勾选设备',true);store({devices:a.map(r=>({mac:r.d.mac,remove:true}))})};
$('dns-save').onclick=()=>store({direct_dns:$('direct-dns').value,proxy_dns:$('proxy-dns').value});$('wcreate').onclick=()=>wifi({action:'create',count5:Number($('w5').value||0),count2:Number($('w2').value||0),prefix:$('wprefix').value,start:Number($('wstart').value||1),key:$('wkey').value,node:$('wnode').value,preproxy:$('wnode').value?$('wpre').value:'',dns:$('wdns').value,hidden:$('whidden').value==='1'});$('hide-all').onclick=()=>wifi({action:'hide_all',hidden:true});$('show-all').onclick=()=>wifi({action:'hide_all',hidden:false});
$('sub-add').onclick=()=>sub({action:'save',name:$('sub-name').value,url:$('sub-url').value,interval_hours:Number($('sub-hours').value),enabled:true});$('sub-update').onclick=()=>sub({action:'update',id:'all'});$('assign-type').onchange=assignTargets;$('assign-go').onclick=()=>doAssign(false);$('assign-unbind').onclick=()=>doAssign(true);$('assign-close').onclick=closeAssign;$('assign-modal').onclick=e=>{if(e.target===$('assign-modal'))closeAssign()};
load();
})();
</script>
<%+footer%>
