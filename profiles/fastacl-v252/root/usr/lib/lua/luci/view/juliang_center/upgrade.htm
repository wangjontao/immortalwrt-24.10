<%+header%>
<style>
.ju{max-width:980px;margin:0 auto}.ju h2{margin:4px 0 18px;padding:18px 20px;border:1px solid #adc5df;border-radius:13px;background:linear-gradient(112deg,#bdd5ed,#cedff2 56%,#dcdff2);color:#38465e}.ju-card{padding:20px;border:1px solid #d9dfea;border-radius:8px;background:var(--background-color,#fff);box-shadow:0 2px 10px rgba(0,0,0,.04)}.ju-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ju-label{font-size:12px;color:#788397;margin-bottom:5px}.ju-value{font-size:18px;font-weight:700;overflow-wrap:anywhere}.ju-status{margin:16px 0;padding:13px 15px;border:1px solid #d6e3ef;border-radius:8px;background:#f2f7fc;color:#335e83;line-height:1.5}.ju-status.error{border-color:#edc8cb;background:#fff2f3;color:#ba343d}.ju-status.success{border-color:#cfe6da;background:#edf6f1;color:#176c49}.ju-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.ju-actions button,.ju-actions select{min-height:38px;padding:8px 13px;border:1px solid #8faecb;border-radius:8px;background:#fff;color:#315d84;font-weight:650}.ju-actions button{cursor:pointer}.ju-actions button.primary{background:#315d84;color:#fff}.ju-actions button:disabled{opacity:.55;cursor:default}.ju-note{margin-top:14px;color:#788397;font-size:13px;line-height:1.6}.ju-progress{height:8px;border-radius:8px;background:#e7edf5;overflow:hidden;margin-top:12px}.ju-progress span{display:block;width:20%;height:100%;background:#5b8fb7;animation:ju-wait 1.2s ease-in-out infinite alternate}@keyframes ju-wait{to{transform:translateX(400%)}}@media(max-width:600px){.ju-row{grid-template-columns:1fr}.ju-card{padding:15px}}
</style>
<div class="ju">
	<h2>固件在线升级</h2>
	<div class="ju-card">
		<div class="ju-row">
			<div><div class="ju-label">当前固件</div><div class="ju-value" id="ju-current">读取中</div></div>
			<div><div class="ju-label">设备型号</div><div class="ju-value" id="ju-board">读取中</div></div>
			<div><div class="ju-label">最新版本</div><div class="ju-value" id="ju-latest">-</div></div>
			<div><div class="ju-label">更新通道</div><select id="ju-channel"><option value="stable">稳定版</option><option value="beta">测试版</option></select></div>
		</div>
		<div id="ju-status" class="ju-status">正在读取升级状态…</div>
		<div class="ju-actions">
			<button type="button" id="ju-check">检查更新</button>
			<button type="button" class="primary" id="ju-install" hidden>下载并升级</button>
		</div>
	</div>
</div>
<script>(function(){'use strict';var statusUrl='<%=luci.dispatcher.build_url("admin","juliang","upgrade","status")%>',actionUrl='<%=luci.dispatcher.build_url("admin","juliang","upgrade","action")%>',token='<%=token%>',current='',latest='',state='',busy=false,statusTimer=null;var $=function(id){return document.getElementById('ju-'+id)};function setBusy(v){busy=v;$('check').disabled=v;$('channel').disabled=v;if($('install').hidden===false)$('install').disabled=v}function show(text,kind){var box=$('status');box.className='ju-status'+(kind?' '+kind:'');box.textContent=text}function messageFor(s){return{idle:'尚未检查更新',checking:'正在连接更新服务器并验证签名…',available:'发现新版本，可以下载并升级。',downloading:'正在下载固件…',verifying:'正在校验固件…',ready:'固件已通过校验。',installing:'正在写入固件，设备即将重启，请不要断电。',uptodate:'当前已经是最新版本。',unavailable:'当前机型暂未提供在线升级镜像。',disabled:'在线升级功能已关闭。',rebooting:'升级任务已提交，等待设备重启。',success:'升级完成，新版本已经运行。',failed:'升级失败，请查看状态后重试。'}[s]||('升级状态：'+s)}function render(s){state=s.state||'';current=s.current_version||current;latest=s.latest_version||latest;$('current').textContent=current||'-';$('board').textContent=s.board||'-';$('latest').textContent=latest||'-';$('channel').value=s.channel||$('channel').value;$('install').hidden=state!=='available';$('install').disabled=busy||state!=='available';show(messageFor(state),state==='failed'?'error':(state==='success'?'success':''));var waiting=['checking','downloading','verifying','installing','rebooting'].indexOf(state)>=0;if(waiting&&!statusTimer)statusTimer=setInterval(loadStatus,2000);if(!waiting&&statusTimer){clearInterval(statusTimer);statusTimer=null}}async function loadStatus(){try{var r=await fetch(statusUrl,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error('状态读取失败');render(d)}catch(e){show(e.message,'error')}}async function action(kind){if(busy)return;if(kind==='install'&&!confirm('确认下载并升级到最新版本？设备会自动写入固件并重启。'))return;setBusy(true);if(kind==='check')show('正在检查更新…');else show('正在启动下载任务…');try{var body=new URLSearchParams({token:token,action:kind,channel:$('channel').value}),r=await fetch(actionUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'操作失败');setTimeout(loadStatus,400)}catch(e){show(e.message,'error')}finally{setBusy(false)}}$('check').onclick=function(){action('check')};$('install').onclick=function(){action('install')};$('channel').onchange=function(){latest='';$('latest').textContent='-';$('install').hidden=true;show('通道已切换，请检查更新')};loadStatus()})();</script>
<%+footer%>
