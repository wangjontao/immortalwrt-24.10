<%+header%>
<style>
.jc{max-width:1500px;width:100%;margin:auto;box-sizing:border-box;padding:0 4px 20px}.jc h2{margin:4px 0;font-size:27px}.jc-sub{opacity:.68;margin-bottom:18px}.jc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.jc-card,.jc-action{border:1px solid rgba(128,128,128,.18);border-radius:14px;padding:18px;background:var(--background-color,#fff);box-shadow:0 2px 10px rgba(0,0,0,.04)}.jc-card h3{margin:0 0 10px;font-size:14px;opacity:.7}.jc-value{font-size:21px;font-weight:700}.jc-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}.jc-action{text-decoration:none!important;display:block}.jc-action b{font-size:18px}.jc-action p{opacity:.68;margin:8px 0 0}.jc-ok{color:#159957}.jc-bad{color:#d74646}@media(max-width:600px){.jc{padding:0 1px}.jc-grid,.jc-actions{grid-template-columns:1fr}.jc-card,.jc-action{padding:14px}}
</style>
<div class="jc"><h2>JuLiang 控制中心</h2><div class="jc-sub">S20L · dae/eBPF · FastACL 2.5.2-dev.2</div>
<div class="jc-grid"><div class="jc-card"><h3>WAN</h3><div id="jc-wan" class="jc-value">读取中…</div><div id="jc-wan-dev"></div></div><div class="jc-card"><h3>FastACL</h3><div id="jc-fast" class="jc-value">读取中…</div><div>代理故障保持断网保护</div></div><div class="jc-card"><h3>无线</h3><div id="jc-wifi" class="jc-value">-</div><div id="jc-managed"></div></div><div class="jc-card"><h3>系统</h3><div id="jc-host" class="jc-value">-</div><div id="jc-up"></div></div></div>
<div class="jc-actions"><a class="jc-action" href="<%=luci.dispatcher.build_url('admin','services','fastacl252')%>"><b>FastACL 控制台</b><p>设备出口、节点导入、DNS、前置代理、多 WiFi 管理。</p></a><a class="jc-action" href="<%=luci.dispatcher.build_url('admin','services','fastacl252')%>"><b>多 WiFi / DNS</b><p>建立附加 WiFi、绑定节点、独立 DNS 和一键隐藏。</p></a></div></div>
<script>(function(){function t(s){return String(s==null?'':s)}function up(n){n=Number(n)||0;var d=Math.floor(n/86400),h=Math.floor(n%86400/3600),m=Math.floor(n%3600/60);return(d?d+'天 ':'')+h+'小时 '+m+'分钟'}XHR.get('<%=luci.dispatcher.build_url('admin','juliang','status')%>',{},function(x,r){if(!r||!r.ok)return;var w=document.getElementById('jc-wan');w.textContent=r.wan_up?(r.wan_ip||'已连接'):'未连接';w.className='jc-value '+(r.wan_up?'jc-ok':'jc-bad');document.getElementById('jc-wan-dev').textContent=t(r.wan_device);var f=r.fastacl||{},e=f.engine||'stopped';var fe=document.getElementById('jc-fast');fe.textContent=e;fe.className='jc-value '+(e==='running'?'jc-ok':'jc-bad');document.getElementById('jc-wifi').textContent=t(r.wifi_count)+' 个';document.getElementById('jc-managed').textContent='FastACL 管理：'+t(r.managed_wifi)+' 个';document.getElementById('jc-host').textContent=t(r.hostname);document.getElementById('jc-up').textContent=up(r.uptime)})})();</script>
<%+footer%>
