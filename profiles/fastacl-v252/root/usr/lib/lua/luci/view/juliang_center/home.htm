<%+header%>
<style>
.jc{max-width:1500px;width:100%;margin:auto;box-sizing:border-box;padding:0 4px 20px}.jc h2{margin:4px 0;font-size:27px}.jc-sub{opacity:.68;margin-bottom:18px}.jc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.jc-card,.jc-action{border:1px solid rgba(128,128,128,.18);border-radius:14px;padding:18px;background:var(--background-color,#fff);box-shadow:0 2px 10px rgba(0,0,0,.04)}.jc-card h3{margin:0 0 10px;font-size:14px;opacity:.7}.jc-value{font-size:21px;font-weight:700}.jc-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}.jc-action{text-decoration:none!important;display:block}.jc-action b{font-size:18px}.jc-action p{opacity:.68;margin:8px 0 0}.jc-ok{color:#159957}.jc-bad{color:#d74646}@media(max-width:600px){.jc{padding:0 1px}.jc-grid,.jc-actions{grid-template-columns:1fr}.jc-card,.jc-action{padding:14px}}
.jc{max-width:none;min-width:0;margin:0 auto}.jc *{box-sizing:border-box}.jc h2{background:linear-gradient(110deg,#e3eaf3,#eee8ef)!important;color:#38465e!important;padding:18px 20px!important;border-radius:13px;font-weight:800;border:1px solid #d9dfea;box-shadow:0 3px 12px #414e6910}.jc-card h3{opacity:1!important;background:linear-gradient(110deg,#e7edf5,#eeebf4)!important;color:#41516a!important;border-radius:8px;padding:10px 12px!important;font-weight:750!important}.jc-action b{display:block;background:linear-gradient(110deg,#e7edf5,#eeebf4);color:#41516a;padding:10px 12px;border-radius:8px}.jc-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}.jc-card{min-width:0}.jc-value{overflow-wrap:anywhere}.jc-speed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:10px}.jc-label{font-size:12px;color:#788397}.jc-speed .jc-value{font-size:20px;font-variant-numeric:tabular-nums}@media(max-width:600px){.jc-grid,.jc-actions{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="jc"><h2>JuLtiang 控制中心</h2><div class="jc-sub">dae/eBPF · FastACL 2.5.3</div>
<div class="jc-grid"><div class="jc-card jc-speed"><h3>WAN 实时网络速度</h3><div class="jc-speed-grid"><div><span class="jc-label">↑ 上传</span><div id="jc-upload" class="jc-value">—</div></div><div><span class="jc-label">↓ 下载</span><div id="jc-download" class="jc-value">—</div></div></div><div id="jc-speed-status" class="jc-label">等待第二次采样 · 每 3 秒更新</div></div><div class="jc-card"><h3>WAN</h3><div id="jc-wan" class="jc-value">读取中…</div><div id="jc-wan-dev"></div></div><div class="jc-card"><h3>FastACL</h3><div id="jc-fast" class="jc-value">读取中…</div><div>代理故障保持断网保护</div></div><a class="jc-card jc-action" href="<%=luci.dispatcher.build_url('admin','juliang','wireless')%>"><h3>无线设备 ›</h3><div id="jc-wifi" class="jc-value">-</div><div id="jc-managed"></div></a><div class="jc-card"><h3>系统</h3><div id="jc-host" class="jc-value">-</div><div id="jc-up"></div></div></div>
<div class="jc-actions"><a class="jc-action" href="<%=luci.dispatcher.build_url('admin','services','fastacl252')%>"><b>FastACL 控制台</b><p>设备出口、节点导入、DNS、前置代理、多 WiFi 管理。</p></a><a class="jc-action" href="<%=luci.dispatcher.build_url('admin','services','fastacl252')%>"><b>多 WiFi / DNS</b><p>建立附加 WiFi、绑定节点、独立 DNS 和一键隐藏。</p></a></div></div>
<script>(function(){'use strict';var previous=null,busy=false,url='<%=luci.dispatcher.build_url('admin','juliang','status')%>';function $(id){return document.getElementById('jc-'+id)}function text(v){return String(v==null?'':v)}function uptime(n){n=Number(n)||0;return Math.floor(n/86400)+'天 '+Math.floor(n%86400/3600)+'小时 '+Math.floor(n%3600/60)+'分钟'}function rate(bytes,dt){if(!(dt>0)||!(bytes>=0))return '—';var n=bytes/dt;if(n>=1048576)return(n/1048576).toFixed(2)+' MB/s';if(n>=1024)return(n/1024).toFixed(1)+' KB/s';return n.toFixed(0)+' B/s'}async function update(){if(busy||document.hidden)return;busy=true;try{var response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error();var r=await response.json();if(!r.ok)throw Error();$('wan').textContent=r.wan_up?(r.wan_ip||'已连接'):'未连接';$('wan').className='jc-value '+(r.wan_up?'jc-ok':'jc-bad');$('wan-dev').textContent=text(r.wan_device);var f=r.fastacl||{},e=f.engine||'stopped';$('fast').textContent=e;$('fast').className='jc-value '+(e==='running'?'jc-ok':'jc-bad');$('wifi').textContent=text(r.wifi_count)+' 个';$('managed').textContent='FastACL 管理：'+text(r.managed_wifi)+' 个';$('host').textContent=text(r.hostname).replace(/[- ]S20L$/i,'');$('up').textContent=uptime(r.uptime);var t=r.traffic||{},dt=previous&&t.device===previous.device?t.timestamp-previous.timestamp:0;$('upload').textContent=r.wan_up&&previous?rate(t.tx_bytes-previous.tx_bytes,dt):'—';$('download').textContent=r.wan_up&&previous?rate(t.rx_bytes-previous.rx_bytes,dt):'—';$('speed-status').textContent=(dt>0?'已更新 '+new Date().toLocaleTimeString():'等待第二次采样')+' · 每 3 秒更新';previous=t;}catch(e){$('speed-status').textContent='读取失败，等待重试';$('upload').textContent='—';$('download').textContent='—';previous=null;}finally{busy=false}}update();setInterval(update,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});})();</script>
<%+footer%>
