<%+header%>
<style>.f252{width:100%;min-width:0;margin:0 auto}.f252 *{box-sizing:border-box}.f252 h2,.f252 h3{background:linear-gradient(110deg,#e3eaf3,#eee8ef);color:#38465e;padding:16px;border-radius:10px;font-weight:750}.f252 .card{padding:14px;border:1px solid #dfe4ed;border-radius:12px}.f252 .head,.f252 .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.f252 .note,.f252 .meta{color:#7b8498;font-size:13px;overflow-wrap:anywhere}.f252 .title{font-weight:700}.f252 .pill{background:#e8eaf5;padding:4px 10px;border-radius:20px}.f252 .field label{display:block;color:#7b8498;margin-bottom:4px}.f252 details>summary{cursor:pointer;font-weight:700;color:#41516a;padding:12px;background:linear-gradient(110deg,#e7edf5,#eeebf4);border-radius:8px}.f252{container-type:inline-size}.f252 .wireless-ap{border:1px solid #dfe4ed;border-radius:10px;padding:12px;margin:9px 0}.f252 .wireless-station{display:grid;grid-template-columns:minmax(180px,1fr) 110px minmax(190px,1fr) minmax(170px,1fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid #e7eaf0;margin-top:9px}.f252 .wireless-station .field{min-width:0;overflow-wrap:anywhere}.f252 .wireless-station .field label{font-size:12px}.f252 .wireless-identity{min-width:0}@container(max-width:800px){.f252 .wireless-station{grid-template-columns:repeat(2,minmax(0,1fr))}}@container(max-width:450px){.f252 .wireless-station{grid-template-columns:minmax(0,1fr)}}</style>
<div class="f252"><h2>无线设备</h2>  <div class="card" id="f25-wireless-section">
    <details open><summary>无线连接设备与实时速率</summary><div class="head"><span id="f25-wireless-count" class="pill">读取中</span></div>
    <div class="bar"><button type="button" class="cbi-button" id="f25-wireless-refresh">刷新无线设备</button><span class="note" id="f25-wireless-status">每 3 秒更新；折叠后暂停</span></div>
    <p class="note">上传 / 下载：设备与路由器之间的实际流量速率（含局域网），按无线累计字节采样计算；链路速率：无线协商速率，不代表实际网速。首次采样显示 —。</p>
    <div id="f25-wireless-list"></div>
  </details></div></div>
<script>(function(){'use strict';
const $=x=>document.getElementById('f25-'+x);function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function field(name,c){const d=el('div','field');d.append(el('label','',name),c);return d}async function api(){const r=await fetch('<%=luci.dispatcher.build_url("admin","services","fastacl252_wireless")%>',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||'读取失败');return j}
let wirelessBusy=false,wirelessPrevious=new Map();
function speedText(bytes,seconds){return seconds>0&&bytes>=0?(bytes*8/seconds/1000000).toFixed(2)+' Mbps':'—'}
function renderWireless(data){const next=new Map(),root=$('wireless-list');root.replaceChildren();let total=0;for(const ap of data.interfaces||[]){const box=el('div','wireless-ap'),header=el('div','head'),stations=ap.stations||[];header.append(el('div','title',ap.ssid+' · '+ap.radio),el('span','pill',stations.length+' 台'));box.append(header,el('div','meta',ap.id+' · '+(ap.network||'')+' · '+(ap.up?'运行中':'未运行')));total+=stations.length;for(const d of stations){const key=ap.id+'/'+d.mac,previous=wirelessPrevious.get(key),dt=previous?data.timestamp-previous.time:0,up=previous?speedText(d.rx_bytes-previous.rx,dt):'—',down=previous?speedText(d.tx_bytes-previous.tx,dt):'—';next.set(key,{time:data.timestamp,rx:d.rx_bytes,tx:d.tx_bytes});const row=el('div','wireless-station'),identity=el('div','wireless-identity');identity.append(el('div','title',d.name||'未命名设备'),el('div','meta',d.mac),el('div','meta',d.ip||'IP 暂未发现'));row.append(identity,field('信号',el('span','',d.signal!=null?d.signal+' dBm':'—')),field('上传 / 下载',el('span','',up+' / '+down)),field('链路 Tx / Rx',el('span','',(d.tx_link_mbps!=null?d.tx_link_mbps:'—')+' / '+(d.rx_link_mbps!=null?d.rx_link_mbps:'—')+' Mbps')));box.append(row);}if(!stations.length)box.append(el('div','note','暂无连接设备'));root.append(box);}wirelessPrevious=next;$('wireless-count').textContent=(data.interfaces||[]).length+' 个无线接口 · '+total+' 台连接';$('wireless-status').textContent='每 3 秒更新 · '+new Date().toLocaleTimeString()+' 已更新';}
async function refreshWireless(force){if(wirelessBusy||document.hidden)return;const section=$('wireless-section')?.querySelector('details');if(!force&&section&&!section.open)return;wirelessBusy=true;try{renderWireless(await api('wireless'));}catch(e){$('wireless-status').textContent=e.message+'；保留上次数据';}finally{wirelessBusy=false}}
$('wireless-refresh').onclick=()=>refreshWireless(true);refreshWireless();setInterval(()=>refreshWireless(),3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshWireless()});})();</script>
<%+footer%>
