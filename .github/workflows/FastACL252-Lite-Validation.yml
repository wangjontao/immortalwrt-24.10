name: FastACL 2.5.2 Lite Fast Path Validation

'on':
  workflow_dispatch: {}
  push:
    branches:
      - codex/fastacl252-lite-fast
    paths:
      - .github/workflows/FastACL252-Lite-Validation.yml
      - profiles/fastacl-v252/**
      - scripts/integrate-fastacl252-s20l.sh

permissions:
  contents: read

concurrency:
  group: fastacl252-lite-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Lite hot-path, UI, Lua, Go and node validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 nftables iproute2 curl shfmt
          python3 -m venv .venv
          .venv/bin/pip install lupa PyYAML playwright
          .venv/bin/playwright install --with-deps chromium
          curl -fL --retry 3 -o /tmp/dae-amd64.tar.xz \
            https://github.com/daeuniverse/dae/releases/download/v2.1.1/dae-linux-x86_64.tar.xz
          echo 'c550af580dc97cc90986260da78c4bf72917f3213c2b5d8b79c45199d9c3dc90  /tmp/dae-amd64.tar.xz' | sha256sum -c -
          mkdir /tmp/dae-core
          tar -xJf /tmp/dae-amd64.tar.xz -C /tmp/dae-core
          install -m755 "$(find /tmp/dae-core -type f -name dae | head -n1)" /tmp/dae

      - name: Lite architecture regression
        run: |
          python3 profiles/fastacl-v252/tests/test_lite_hotpath.py
          python3 profiles/fastacl-v252/tests/test_runtime.py
          grep -q "PKG_VERSION:=2.5.2-lite.1" profiles/fastacl-v252/package-Makefile
          grep -q "version='2.5.2-lite.1'" profiles/fastacl-v252/root/usr/lib/lua/luci/controller/fastacl252.lua

      - name: Shell and Lua syntax
        run: |
          find profiles/fastacl-v252/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          find profiles/fastacl-v252/root -type f | while read -r file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then
              sh -n "$file"
              shfmt -ln posix "$file" >/dev/null
            fi
          done

      - name: Import and subscription regression
        run: |
          .venv/bin/python profiles/fastacl-v252/tests/test_import.py
          .venv/bin/python profiles/fastacl-v252/tests/test_subscription.py
          .venv/bin/python profiles/fastacl-v252/tests/test_menu_cleanup.py
          .venv/bin/python profiles/fastacl-v252/tests/test_reboot.py
          .venv/bin/python profiles/fastacl-v252/tests/test_login_theme.py

      - name: Native DNS relay tests
        run: |
          cd profiles/fastacl-v252/dns
          go mod tidy
          go test -race -timeout 2m ./...
          go build -trimpath -o /tmp/fastacl252-dns .

      - name: Native node to dae validation
        run: |
          .venv/bin/python profiles/fastacl-v252/tests/test_mihomo.py \
            --core /tmp/dae --helper /tmp/fastacl252-dns
          for config in profiles/fastacl-v252/test-results/import-*.dae; do
            /tmp/dae validate -c "$config"
          done

      - name: Responsive quick-switch console regression
        run: |
          cd profiles/fastacl-v252/tests
          ../../..//.venv/bin/python test_browser.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastACL252-Lite-validation-evidence
          path: profiles/fastacl-v252/test-results/*
          if-no-files-found: warn
          retention-days: 14
