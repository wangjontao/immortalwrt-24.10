name: MT7986 Series FastACL 2.8.0 Build
run-name: 'FastACL 2.8.0 - native sing-box for S20L S20P JDCloud and Redmi AX6000'

'on':
  workflow_dispatch: {}
  push:
    branches: ['2.8.0']
    paths:
      - '.github/workflows/JuLiangTK-MT7986-FastACL280.yml'
      - 'profiles/fastacl-v252/**'
      - 'scripts/integrate-fastacl252-s20l.sh'
      - 'scripts/integrate-fastacl252-dependencies.sh'
      - 'scripts/tests/test_redmi_110m_layout.py'
      - 'build-configs/*FastACL280.txt'
      - 'target/linux/mediatek/**'

permissions:
  contents: read

concurrency:
  group: fastacl280-JuLiangTK-MT7986-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Native sing-box architecture and UI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Install validation tools
        run: |
          . /etc/os-release
          printf 'deb https://archive.ubuntu.com/ubuntu %s main universe multiverse restricted\ndeb https://archive.ubuntu.com/ubuntu %s-updates main universe multiverse restricted\ndeb https://security.ubuntu.com/ubuntu %s-security main universe multiverse restricted\n' "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" > /tmp/juliang-ubuntu.list
          sudo mkdir -p /tmp/juliang-apt-lists/partial
          apt_options=(-o Dir::Etc::sourcelist=/tmp/juliang-ubuntu.list -o Dir::Etc::sourceparts=- -o Dir::State::lists=/tmp/juliang-apt-lists -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo timeout 300 apt-get "${apt_options[@]}" update
          sudo timeout 600 apt-get "${apt_options[@]}" install -y --no-install-recommends lua5.1 nftables iproute2 curl shfmt
          python3 -m venv .venv
          .venv/bin/pip install lupa PyYAML playwright
          .venv/bin/playwright install --with-deps chromium
          curl -fL --retry 3 -o /tmp/sing-box.tgz https://github.com/SagerNet/sing-box/releases/download/v1.12.25/sing-box-1.12.25-linux-amd64.tar.gz
          echo 'a1ec76e2b6b139eb747a1b1ebee7d14b8d4be5a833596cad8070a31ef960301f  /tmp/sing-box.tgz' | sha256sum -c -
          mkdir /tmp/sing-box-core
          tar -xzf /tmp/sing-box.tgz --strip-components=1 -C /tmp/sing-box-core
          install -m755 /tmp/sing-box-core/sing-box /tmp/sing-box
      - name: Validate architecture, syntax and control flow
        run: |
          python3 profiles/fastacl-v252/tests/test_bbr.py
          .venv/bin/python profiles/fastacl-v252/tests/test_hardware_mac.py
          .venv/bin/python profiles/fastacl-v252/tests/test_wifi_creation.py
          python3 scripts/tests/test_ci_update_feeds.py
          python3 scripts/tests/test_fastacl280_devices.py
          .venv/bin/python profiles/fastacl-v252/tests/test_wireless.py
          .venv/bin/python profiles/fastacl-v252/tests/test_wifi_fw4.py
          .venv/bin/python profiles/fastacl-v252/tests/test_tun_dataplane.py --sing-box /tmp/sing-box
          .venv/bin/python profiles/fastacl-v252/tests/test_control.py
          .venv/bin/python profiles/fastacl-v252/tests/test_traffic_ui.py
          .venv/bin/python profiles/fastacl-v252/tests/test_fixed_exit.py
          python3 profiles/fastacl-v252/tests/test_online_upgrade.py
          python3 profiles/fastacl-v252/tests/test_update_manifest.py
          node --check profiles/fastacl-v252/root/www/luci-static/resources/view/wan-watchdog.js
          find profiles/fastacl-v252/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          find profiles/fastacl-v252/root -type f | while read -r file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then sh -n "$file"; shfmt -ln posix "$file" >/dev/null; fi
          done
          .venv/bin/python profiles/fastacl-v252/tests/test_import.py
          .venv/bin/python profiles/fastacl-v252/tests/test_split_data.py
          .venv/bin/python profiles/fastacl-v252/tests/test_subscription.py
          .venv/bin/python profiles/fastacl-v252/tests/test_menu_cleanup.py
          .venv/bin/python profiles/fastacl-v252/tests/test_reboot.py
          .venv/bin/python profiles/fastacl-v252/tests/test_login_theme.py
      - name: Validate DNS relay
        run: |
          (cd profiles/fastacl-v252/dns && go mod tidy && go mod vendor && go test -mod=vendor -race -timeout 2m ./... && go build -mod=vendor -trimpath -o /tmp/fastacl252-dns .)
          for config in profiles/fastacl-v252/test-results/import-*.json; do
            /tmp/sing-box check -c "$config"
          done
      - name: Validate console in Chromium
        run: |
          cd profiles/fastacl-v252/tests
          ../../../.venv/bin/python test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastACL280-MT7986-preflight-evidence
          path: profiles/fastacl-v252/test-results/*
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build ${{ matrix.label }} FastACL 2.8.0
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - device: clx_s20l
            tag: S20L
            label: CLX S20L AX6000
          - device: clx_s20p
            tag: S20P
            label: CLX S20P AX6000 2.5G
          - device: jdcloud_re-cp-03
            tag: JDCloud-RE-CP-03
            label: JDCloud Baili RE-CP-03 AX6000
          - device: xiaomi_redmi-router-ax6000
            tag: Redmi-AX6000-NMBM110M
            label: Redmi AX6000 NMBM 110MiB
        exclude:
          - device: clx_s20l
          - device: clx_s20p
          - device: jdcloud_re-cp-03
    env:
      DEVICE: ${{ matrix.device }}
      DEVICE_TAG: ${{ matrix.tag }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache OpenWrt build packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: fastacl280-apt-noble-openwrt-v1
      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_options="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120"
          sudo apt-get $apt_options update
          sudo apt-get $apt_options install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p .ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Restore source and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: fastacl280-mt7986-${{ matrix.device }}-${{ hashFiles('build-configs/*FastACL280.txt', 'profiles/fastacl-v252/package-Makefile', 'profiles/fastacl-v252/singbox-Makefile', 'profiles/fastacl-v252/dependencies.config', 'profiles/fastacl-v252/dns/go.mod') }}
          restore-keys: |
            fastacl280-mt7986-${{ matrix.device }}-
      - name: Update feeds
        run: |
          sh scripts/ci-update-feeds.sh
          ./scripts/feeds install -a
          ./scripts/feeds install -f -p packages nps npc || true
          ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn luci-app-autoreboot || true
      - name: Add Argon and NPS defaults
        run: |
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f 2>/dev/null | head -n1)"
          if [ -n "$NPS_CONFIG_FILE" ]; then
            cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
          config nps
            option enabled '1'
            option server_addr 'nps.jontao.top'
            option server_port '8024'
            option protocol 'tcp'
            option compress '1'
            option crypt '1'
            option vkey 'WANMAC'
            option log_level '4'
          NPS_CONFIG
          fi
      - name: Integrate FastACL 2.8.0
        run: |
          sh scripts/integrate-fastacl252-s20l.sh "$DEVICE"
          grep -q 'PKG_VERSION:=2.8.0' package/fastacl252/Makefile
          grep -q "version='2.8.0'" package/fastacl252/files/usr/lib/lua/luci/controller/fastacl252.lua
          grep -q 'CONFIG_PACKAGE_juliangtk-sing-box=y' .config
          ! grep -q "fastacl252_dae\\|router.next.dae" package/fastacl252/files/usr/bin/fastacl252
          python3 scripts/tests/test_ci_update_feeds.py
          if [ "$DEVICE" = "xiaomi_redmi-router-ax6000" ]; then python3 scripts/tests/test_redmi_110m_layout.py; fi
      - name: Download sources
        run: |
          make download -j"$(nproc)" || make download -j1 V=s
          find dl -type f -size -1024c -print -delete
      - name: Compile device firmware
        run: |
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" V=s
          kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
          make buildinfo
          for metadata in config feeds version; do
            test -s "bin/targets/mediatek/filogic/${metadata}.buildinfo"
          done
          make package/compile -j"$(nproc)" || make package/compile -j1 V=s
          make -j1 V=s
      - name: Verify and collect firmware
        run: |
          mkdir -p upload
          mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f \( -iname "*${DEVICE}*sysupgrade*" -o -iname "*${DEVICE}*factory*" \) -size +5M)
          [ "${#images[@]}" -gt 0 ] || { echo "ERROR: $DEVICE firmware image missing"; find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort; exit 1; }
          if [ "$DEVICE" = "xiaomi_redmi-router-ax6000" ]; then
            python3 scripts/tests/test_redmi_110m_layout.py \
              --factory "bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-factory.bin" \
              --sysupgrade "bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}-squashfs-sysupgrade.bin"
          fi
          cp -a "${images[@]}" upload/
          manifest="$(python3 scripts/find-fastacl280-manifest.py bin/targets/mediatek/filogic "$DEVICE")"
          [ -s "$manifest" ] || { echo 'ERROR: firmware package manifest missing'; exit 1; }
          for pkg in fastacl252 juliangtk-sing-box kmod-tun kmod-nft-tproxy lyaml luci-theme-argon luci-app-argon-config luci-app-ttyd luci-app-autoreboot nps luci-app-nps npc sqm-scripts kmod-sched-cake kmod-ifb; do
            grep -q "^$pkg " "$manifest" || { echo "$pkg missing from firmware"; exit 1; }
          done
          if grep -Ei '^(luci-app-store|luci-app-quickstart|quickstart|taskd) ' "$manifest"; then echo 'ERROR: iStore/QuickStart unexpectedly present'; exit 1; fi
          if grep -Ei '^(luci-app-(passwall2?|homeproxy|openclash)|luci-i18n-(passwall2?|homeproxy|openclash)-)' "$manifest"; then echo 'ERROR: forbidden proxy plugin present'; exit 1; fi
          grep -q '2.8.0' package/fastacl252/Makefile
          grep -q 'nps.jontao.top' package/fastacl252/files/usr/libexec/nps-wan-mac
          cp .config upload/build.config
          cp "$manifest" "upload/${DEVICE}.manifest"
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
          cp "JuLiang-OS-${DEVICE_TAG}-final.config" profiles/fastacl-v252/README-2.8.0.md upload/
          printf 'branch=%s\ncommit=%s\nsource_commit=%s\nsystem=JuLiang OS\nversion=2.8.0\ndevice=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SOURCE_COMMIT" "$DEVICE" > upload/LITE-BUILD.txt
          sha256sum upload/* | tee upload/SHA256SUMS
          ls -lh upload
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JuLiang-OS-${{ matrix.tag }}-2.8.0-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FastACL280-MT7986-build-failure-${{ matrix.device }}-${{ github.run_id }}
          path: |
            logs/
            .config
            JuLiang-OS-*-final.config
          if-no-files-found: ignore
          retention-days: 14
