name: Redmi AX6000 MainWiFi FastACL 1010V1 FastACL2.4.4

on:
  workflow_dispatch:
  push:
    branches:
      - codex/1010v1-fastacl244-mt7986
    paths:
      - '.github/workflows/MT7986-1010V1-FastACL244-Redmi-AX6000-MainWiFi.yml'
      - 'scripts/integrate-fastacl244-1010-mt7986.sh'
      - 'build-configs/AX6000-Redmi-20WiFi.txt'
      - 'files/usr/libexec/dulwifi-firstboot'
      - 'files/etc/init.d/dulwifi-firstboot'
      - 'files/etc/uci-defaults/99-enable-dulwifi-firstboot'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-latest
  cancel-in-progress: true

env:
  PASSWALL_TAG: 26.3.6-1
  PASSWALL2_TAG: 26.3.5-1
  PASSWALL_PACKAGES_COMMIT: 3e11c458c552aefd348232c627fd1ed9f8f08e41
  OPENCLASH_COMMIT: c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Redmi AX6000 FastACL 1010V1 FastACL2.4.4
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout forked ImmortalWrt source
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            lua5.1 bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Restore downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ax6000-redmi-24.10-${{ hashFiles('build-configs/AX6000-Redmi-20WiFi.txt', '.github/workflows/MT7986-1010V1-FastACL244-Redmi-AX6000-MainWiFi.yml') }}
          restore-keys: |
            ax6000-redmi-24.10-

      - name: Update standard feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p luci luci-app-autoreboot

      - name: Add proxy packages, OpenClash, source-feed NPS, and Argon
        run: |
          rm -rf package/luci-app-passwall package/luci-app-passwall2 package/passwall-packages \
            package/luci-app-npc feeds/luci/applications/luci-app-passwall \
            feeds/luci/applications/luci-app-passwall2 feeds/luci/applications/luci-app-npc \
            package/feeds/luci/luci-app-npc

          git clone --depth=1 --branch "$PASSWALL_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/openwrt-passwall
          mv /tmp/openwrt-passwall/luci-app-passwall package/
          git clone --depth=1 --branch "$PASSWALL2_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/openwrt-passwall2
          mv /tmp/openwrt-passwall2/luci-app-passwall2 package/
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git -C package/passwall-packages checkout "$PASSWALL_PACKAGES_COMMIT"
          rm -rf package/passwall-packages/.git

          rm -rf package/luci-app-openclash package/feeds/luci/luci-app-openclash feeds/luci/applications/luci-app-openclash
          curl --fail --location --show-error --silent \
            --connect-timeout 30 --max-time 300 \
            --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 2400 \
            "https://codeload.github.com/vernesong/OpenClash/tar.gz/$OPENCLASH_COMMIT" \
            -o /tmp/openclash.tar.gz
          rm -rf /tmp/openclash
          mkdir -p /tmp/openclash
          tar -xzf /tmp/openclash.tar.gz --strip-components=1 -C /tmp/openclash
          cp -a /tmp/openclash/luci-app-openclash package/
          test -f package/luci-app-openclash/Makefile

          # Install the mutually compatible NPS packages supplied by this source.
          ./scripts/feeds install -f -p packages nps npc
          ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn
          NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f | head -n1)"
          test -n "$NPS_CONFIG_FILE"
          cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
          config nps
                  option enabled '1'
                  option server_addr 'nps.jontao.top'
                  option server_port '8024'
                  option protocol 'tcp'
                  option compress '1'
                  option crypt '1'
                  option vkey 'WANMAC'
                  option log_level '4'
          NPS_CONFIG

          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: Apply tested PassWall and PassWall2 SK5 HTTP import fixes
        run: |
          mkdir -p package/passwall-luci package/passwall2-luci
          ln -sfn ../luci-app-passwall package/passwall-luci/luci-app-passwall
          ln -sfn ../luci-app-passwall2 package/passwall2-luci/luci-app-passwall2
          python3 scripts/patch-passwall-sk5-http.py
          grep -q 'JuLiangTK: allow multiline SOCKS5 shorthand' package/luci-app-passwall/luasrc/view/passwall/node_list/link_add_node.htm
          grep -q 'JuLiangTK: allow multiline SOCKS5 shorthand' package/luci-app-passwall2/luasrc/view/passwall2/node_list/link_add_node.htm
          grep -q 'JuLiangTK: import SOCKS5/SOCKS/HTTP provider links' package/luci-app-passwall/root/usr/share/passwall/subscribe.lua
          grep -q 'JuLiangTK: import SOCKS5/SOCKS/HTTP provider links' package/luci-app-passwall2/root/usr/share/passwall2/subscribe.lua
          grep -q 'mark = (node.protocol ~= "socks") and 255 or nil,' package/luci-app-passwall/luasrc/passwall/util_xray.lua
          grep -q 'mark = (node.protocol ~= "socks") and 255 or nil,' package/luci-app-passwall2/luasrc/passwall2/util_xray.lua
          rm -rf package/passwall-luci package/passwall2-luci

      - name: Apply Redmi AX6000 configuration and defaults
        run: |
          rm -f .config
          cp build-configs/AX6000-Redmi-20WiFi.txt .config
          git clone --depth=1 --branch codex/hy3000-24.10 https://github.com/wangjontao/CloseWRT-CI.git /tmp/ci-config
          cp -a /tmp/ci-config/Files/. package/base-files/files/
          rm -f package/base-files/files/etc/init.d/npc-wan-mac
          rm -f package/base-files/files/etc/uci-defaults/99-enable-npc-wan-mac
          rm -f package/base-files/files/usr/libexec/npc-wan-mac
          chmod 0755 package/base-files/files/etc/uci-defaults/99-dulwifi

          mkdir -p package/base-files/files/usr/libexec
          mkdir -p package/base-files/files/etc/init.d
          mkdir -p package/base-files/files/etc/hotplug.d/iface
          cat > package/base-files/files/usr/libexec/nps-wan-mac <<'NPS_MAC'
          #!/bin/sh
          DONE=/etc/nps-wan-mac.done
          [ -e "$DONE" ] && exit 0
          [ -f /etc/config/nps ] && [ -x /etc/init.d/nps ] || exit 1

          sleep 5
          valid_mac() {
                  case "$1" in ''|00:00:00:00:00:00|ff:ff:ff:ff:ff:ff) return 1;; ??:??:??:??:??:??) return 0;; *) return 1;; esac
          }
          get_wan_mac() {
                  WAN_DEV="$(uci -q get network.wan.device)"
                  WAN_DEV="${WAN_DEV#@}"
                  [ -n "$WAN_DEV" ] || WAN_DEV="$(ip route 2>/dev/null | awk '/default/ {print $5; exit}')"
                  case "$WAN_DEV" in pppoe-*) WAN_DEV="${WAN_DEV#pppoe-}";; esac
                  WAN_MAC=""
                  [ -n "$WAN_DEV" ] && [ -r "/sys/class/net/$WAN_DEV/address" ] && WAN_MAC="$(cat "/sys/class/net/$WAN_DEV/address")"
                  valid_mac "$WAN_MAC" && return 0
                  for LOWER in /sys/class/net/"$WAN_DEV"/lower_*; do
                          [ -r "$LOWER/address" ] || continue
                          WAN_MAC="$(cat "$LOWER/address")"
                          valid_mac "$WAN_MAC" && return 0
                  done
                  return 1
          }
          tries=0
          while [ "$tries" -lt 60 ]; do get_wan_mac && break; tries=$((tries + 1)); sleep 2; done
          valid_mac "$WAN_MAC" || { logger -t nps-wan-mac 'ERROR: physical WAN MAC not found'; exit 1; }
          NPS_KEY="$(printf '%s' "$WAN_MAC" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          uci -q set nps.@nps[0].enabled='1'
          uci -q set nps.@nps[0].server_addr='nps.jontao.top'
          uci -q set nps.@nps[0].server_port='8024'
          uci -q set nps.@nps[0].protocol='tcp'
          uci -q set nps.@nps[0].compress='1'
          uci -q set nps.@nps[0].crypt='1'
          uci -q set nps.@nps[0].vkey="$NPS_KEY"
          uci -q commit nps
          /etc/init.d/nps enable
          /etc/init.d/nps restart
          touch "$DONE"
          logger -t nps-wan-mac "NPS configured from physical WAN MAC $WAN_DEV"
          NPS_MAC

          cat > package/base-files/files/etc/init.d/nps-wan-mac <<'NPS_INIT'
          #!/bin/sh /etc/rc.common
          START=98
          STOP=10
          start() { [ -e /etc/nps-wan-mac.done ] || /usr/libexec/nps-wan-mac >/dev/null 2>&1 & }
          NPS_INIT

          cat > package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac <<'NPS_HOTPLUG'
          #!/bin/sh
          [ -e /etc/nps-wan-mac.done ] && exit 0
          [ "$INTERFACE" = 'wan' ] && [ "$ACTION" = 'ifup' ] && /usr/libexec/nps-wan-mac >/dev/null 2>&1 &
          NPS_HOTPLUG

          cat > package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac <<'NPS_DEFAULT'
          #!/bin/sh
          /etc/init.d/nps-wan-mac enable
          /etc/init.d/nps-wan-mac start
          exit 0
          NPS_DEFAULT

          chmod 0755 package/base-files/files/usr/libexec/nps-wan-mac
          chmod 0755 package/base-files/files/etc/init.d/nps-wan-mac
          chmod 0755 package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac
          chmod 0755 package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac

          sed -i "s/192\\.168\\.[0-9]*\\.[0-9]*/192.168.7.1/g" package/base-files/files/bin/config_generate
          sed -i "s/hostname='.*'/hostname='DulWiFi'/g" package/base-files/files/bin/config_generate
          ROOT_HASH="$(openssl passwd -1 '@password@')"
          sed -i "s#^root:[^:]*:#root:${ROOT_HASH}:#" package/base-files/files/etc/shadow

          # Keep only the two physical Wi-Fi interfaces; disable/remove the legacy AP1-AP5 bootstrap.
          rm -f files/etc/init.d/setup-20wifi-firstboot
          rm -f files/etc/uci-defaults/99-enable-20wifi-firstboot
          rm -f files/root/setup-20wifi-acl.sh files/root/add_ap20_wifi.sh
          rm -rf files/root/ap20-wifi-config

          mkdir -p files/etc/juliang-20wifi
          cp profiles/s20l-uploaded/20wifi/passwall files/etc/juliang-20wifi/passwall
          cp profiles/s20l-uploaded/20wifi/passwall2 files/etc/juliang-20wifi/passwall2
          chmod 0600 files/etc/juliang-20wifi/passwall files/etc/juliang-20wifi/passwall2
          cmp -s profiles/s20l-uploaded/20wifi/passwall files/etc/juliang-20wifi/passwall
          cmp -s profiles/s20l-uploaded/20wifi/passwall2 files/etc/juliang-20wifi/passwall2

          cat > files/usr/libexec/dulwifi-firstboot <<'SCRIPT'
          #!/bin/sh
          exec /usr/libexec/juliang-mainwifi-setup
          SCRIPT
          chmod 0755 files/usr/libexec/dulwifi-firstboot
          chmod 0755 files/etc/init.d/dulwifi-firstboot
          chmod 0755 files/etc/uci-defaults/99-enable-dulwifi-firstboot

          cat > files/etc/uci-defaults/93-hold-passwall-until-20wifi-profile <<'PWBOOT'
          #!/bin/sh
          /etc/init.d/passwall disable >/dev/null 2>&1 || true
          /etc/init.d/passwall2 disable >/dev/null 2>&1 || true
          exit 0
          PWBOOT
          chmod 0755 files/etc/uci-defaults/93-hold-passwall-until-20wifi-profile

          install -D -m0755 profiles/realtime-ip-v4/install-argon-realtime-ip-v4.sh files/usr/bin/install-argon-realtime-ip-v4
          cat > files/etc/uci-defaults/95-argon-realtime-ip-v4 <<'REALTIMEIP'
          #!/bin/sh
          /usr/bin/install-argon-realtime-ip-v4 >/tmp/install-argon-realtime-ip-v4.log 2>&1 || exit 1
          exit 0
          REALTIMEIP
          chmod 0755 files/etc/uci-defaults/95-argon-realtime-ip-v4

          sed -i "/^CONFIG_PACKAGE_luci-app-store=/d; /^CONFIG_PACKAGE_luci-app-quickstart=/d; /^CONFIG_PACKAGE_quickstart=/d" .config
          printf '# CONFIG_PACKAGE_luci-app-store is not set\n# CONFIG_PACKAGE_luci-app-quickstart is not set\n# CONFIG_PACKAGE_quickstart is not set\n' >> .config
          make defconfig
          test -x files/usr/libexec/dulwifi-firstboot
          test -x files/etc/init.d/dulwifi-firstboot
          test -x files/etc/uci-defaults/99-enable-dulwifi-firstboot
          test -x files/usr/bin/install-argon-realtime-ip-v4
          test -x files/etc/uci-defaults/95-argon-realtime-ip-v4
          [ "$(grep -c '^config acl_rule' profiles/s20l-uploaded/20wifi/passwall)" -eq 20 ]
          [ "$(grep -c '^config acl_rule' profiles/s20l-uploaded/20wifi/passwall2)" -eq 20 ]
          [ "$(grep -Ec "^[[:space:]]*config[[:space:]]+shunt_rules[[:space:]]+'A[0-9]+'" profiles/s20l-uploaded/20wifi/passwall)" -eq 20 ]
          [ "$(grep -Ec "^[[:space:]]*config[[:space:]]+shunt_rules[[:space:]]+'A[0-9]+'" profiles/s20l-uploaded/20wifi/passwall2)" -eq 20 ]
          for i in $(seq 1 20); do
              grep -q "option remarks 'AP$i'" profiles/s20l-uploaded/20wifi/passwall
              grep -q "option remarks 'AP$i'" profiles/s20l-uploaded/20wifi/passwall2
              grep -q "172.16.$i.0/24" profiles/s20l-uploaded/20wifi/passwall
              grep -q "172.16.$i.0/24" profiles/s20l-uploaded/20wifi/passwall2
          done
          grep -q "option acl_enable '1'" profiles/s20l-uploaded/20wifi/passwall2
          grep -q "option start_delay '60'" profiles/s20l-uploaded/20wifi/passwall
          grep -q "option start_delay '60'" profiles/s20l-uploaded/20wifi/passwall2
          grep -q "server_addr='nps.jontao.top'" package/base-files/files/usr/libexec/nps-wan-mac
          grep -q "server_port='8024'" package/base-files/files/usr/libexec/nps-wan-mac
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000=y' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ttyd=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-autoreboot=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-statistics=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y' .config
          grep -q '^CONFIG_PACKAGE_nps=y' .config
          grep -q '^CONFIG_PACKAGE_npc=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nps=y' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-nps-zh-cn=y' .config
          ! grep -q '^CONFIG_PACKAGE_luci-app-npc=y' .config
          NPS_CONFIG_VERIFY="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f | head -n1)"
          test -n "$NPS_CONFIG_VERIFY"
          grep -q "server_addr 'nps.jontao.top'" "$NPS_CONFIG_VERIFY"
          grep -q "server_port '8024'" "$NPS_CONFIG_VERIFY"
          grep -q "compress '1'" "$NPS_CONFIG_VERIFY"
          grep -q "crypt '1'" "$NPS_CONFIG_VERIFY"
          ./scripts/diffconfig.sh | tee Redmi-AX6000-final.config

      - name: Preinstall tested realtime-IP suite and WAN DHCP MAC self-heal
        run: |
          test -f package/luci-app-passwall2/root/usr/share/passwall2/app.sh
          grep -q 'acl_enable' package/luci-app-passwall2/root/usr/share/passwall2/0_default_config
          mkdir -p package/base-files/files
          cp -a profiles/proxy-realtime-ip-suite/root/. package/base-files/files/
          chmod 0755             package/base-files/files/usr/bin/proxy-socks-ip-probe             package/base-files/files/usr/bin/proxy-global-ip-json             package/base-files/files/usr/bin/pw2-node-ip-probe             package/base-files/files/usr/bin/pw2-acl-ip-json             package/base-files/files/usr/bin/pw-acl-ip-json             package/base-files/files/usr/bin/pw2-socks-watchd             package/base-files/files/usr/bin/install-proxy-realtime-ip-suite             package/base-files/files/etc/init.d/pw2-socks-watch             package/base-files/files/etc/uci-defaults/96-proxy-realtime-ip-suite
          bash scripts/install-wan-dhcp-mac-fix.sh package/base-files/files
          sh -n package/base-files/files/usr/bin/proxy-socks-ip-probe
          sh -n package/base-files/files/usr/bin/pw2-node-ip-probe
          sh -n package/base-files/files/usr/bin/pw2-socks-watchd
          sh -n package/base-files/files/usr/bin/install-proxy-realtime-ip-suite
          sh -n package/base-files/files/usr/sbin/wan-dhcp-heal
          grep -q '^CONFIG_PACKAGE_kmod-mt7915e=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt7986-firmware=y' .config
          grep -q '^CONFIG_PACKAGE_mt7986-wo-firmware=y' .config
          ! grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config
          ! grep -q '^CONFIG_PACKAGE_kmod-warp=y' .config
          echo 'Source-native MT7986 WiFi verified; realtime IP and WAN self-heal installed.'

      - name: Integrate FastACL 1010V1 FastACL2.4.4
        run: |
          bash scripts/integrate-fastacl244-1010-mt7986.sh files
          for root in files package/base-files/files; do
            mkdir -p "$root/etc"
            printf '1010V1 FastACL2.4.4 MainWiFi\n' > "$root/etc/fastacl-firmware-version"
          done
          sed -i '/^CONFIG_VERSION_NUMBER=/d;/^CONFIG_VERSION_DIST=/d' .config
          printf '\nCONFIG_VERSIONOPT=y\nCONFIG_VERSION_NUMBER="1010V1 FastACL2.4.4 MainWiFi"\nCONFIG_VERSION_DIST="JuLiangTK"\n' >> .config
          sed -i "/^CONFIG_PACKAGE_luci-app-store=/d; /^CONFIG_PACKAGE_luci-app-quickstart=/d; /^CONFIG_PACKAGE_quickstart=/d" .config
          printf '# CONFIG_PACKAGE_luci-app-store is not set\n# CONFIG_PACKAGE_luci-app-quickstart is not set\n# CONFIG_PACKAGE_quickstart is not set\n' >> .config
          make defconfig
          grep -q 'visibility_all' files/usr/lib/lua/luci/controller/juliang_operator.lua
          grep -q 'toggleAllVisibility' files/usr/lib/lua/luci/view/juliang_operator/wireless.htm
          test -x files/usr/bin/juliang-fastacl
          test -x files/usr/bin/juliang-fastacl-guard
          test -x files/usr/bin/juliang-operator
          grep -q 'juliang_killswitch' files/usr/bin/juliang-fastacl
          grep -q 'runtime_mode' files/usr/bin/juliang-fastacl-guard
          grep -q "option version '2.4.4'" files/etc/config/juliang_fastacl
          grep -q 'if not _jfa_enabled then' files/usr/lib/lua/luci/view/passwall2/acl_ip_refresh.htm
          grep -q "Port='20022'" files/etc/uci-defaults/97-juliang-operator-mode
          grep -q "username='admin'" files/etc/uci-defaults/97-juliang-operator-mode
          echo 'FastACL 1010V1 FastACL2.4.4 + PassWall2 ACL page fix staged successfully.'

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Compile Redmi AX6000 firmware
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          ccache -z
          # Rebuild the Go module cache after interrupted sing-box downloads.
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          make -j"$(nproc)" || make -j1 V=s
          ccache -s || true

      - name: Verify FastACL 2.4.4 inside final rootfs
        run: |
          JFA="$(find build_dir -type f -path '*/root-mediatek/usr/bin/juliang-fastacl' | head -n1)"
          test -n "$JFA" || { echo 'ERROR: juliang-fastacl missing from final rootfs'; exit 1; }
          ROOTFS="${JFA%/usr/bin/juliang-fastacl}"
          test -x "$ROOTFS/usr/bin/juliang-fastacl"
          test -x "$ROOTFS/usr/bin/juliang-fastacl-guard"
          test -x "$ROOTFS/usr/bin/juliang-operator"
          grep -q 'juliang_killswitch' "$ROOTFS/usr/bin/juliang-fastacl"
          grep -q 'runtime_mode' "$ROOTFS/usr/bin/juliang-fastacl-guard"
          grep -q 'if not _jfa_enabled then' "$ROOTFS/usr/lib/lua/luci/view/passwall2/acl_ip_refresh.htm"
          grep -q "Port='20022'" "$ROOTFS/etc/uci-defaults/97-juliang-operator-mode"
          grep -q "username='admin'" "$ROOTFS/etc/uci-defaults/97-juliang-operator-mode"
          test -s "$ROOTFS/etc/fastacl-release.json"
          grep -q 'jfa_nodes_panel' "$ROOTFS/usr/lib/lua/luci/view/juliang_fastacl/console.htm"
          grep -q 'window.loadStatus' "$ROOTFS/usr/lib/lua/luci/view/juliang_fastacl/batch_wifi.htm"
          grep -q 'jfw-fold' "$ROOTFS/usr/lib/lua/luci/view/juliang_fastacl/batch_wifi.htm"
          grep -q 'JuLiangTk-5G:48' "$ROOTFS/usr/libexec/juliang-mainwifi-setup"
          grep -q 'JuLiangTk-2.4G:9' "$ROOTFS/usr/libexec/juliang-mainwifi-setup"
          echo "Verified final FastACL rootfs: $ROOTFS"

      - name: Verify and collect Redmi AX6000 firmware
        run: |
          mkdir -p upload
          mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -size +5M | grep -Ei 'redmi-router-ax6000.*(factory|sysupgrade)\.bin$')
          [ "${#images[@]}" -gt 0 ] || { echo 'ERROR: no Xiaomi Redmi AX6000 firmware was produced'; find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort; exit 1; }
          mapfile -t manifests < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.manifest' | grep -Ei 'redmi-router-ax6000')
          [ "${#manifests[@]}" -gt 0 ] || { echo 'ERROR: Redmi AX6000 manifest missing'; exit 1; }
          for manifest in "${manifests[@]}"; do
            for pkg in luci-theme-argon luci-app-argon-config luci-app-ttyd luci-app-autoreboot luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash nps luci-app-nps luci-i18n-nps-zh-cn npc; do
              grep -q "^$pkg " "$manifest" || { echo "ERROR: $pkg missing from $manifest"; exit 1; }
            done
          done
          cp -a "${images[@]}" "${manifests[@]}" upload/
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
          cp Redmi-AX6000-final.config upload/
          sha256sum upload/* | tee upload/SHA256SUMS
          ls -lh upload

      - name: Upload Redmi AX6000 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-MainWiFi-FastACL-1010V1-FastACL2.4.4-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Redmi AX6000 firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Redmi-AX6000-MainWiFi-FastACL-1010V1-FastACL2.4.4-24.10-${{ env.BUILD_DATE }}
          name: Redmi AX6000 MainWiFi FastACL 1010V1 FastACL2.4.4 24.10 ${{ env.BUILD_DATE }}
          files: upload/*
          body: |
            Xiaomi Redmi Router AX6000 (standard 110 MiB UBI profile) / MT7986A, built from the same successful MainWiFi V3 configuration as reference run 36814499479.
            Source commit: ${{ env.WRT_HASH }}
            FastACL core: 1010V1 FastACL2.4.4 pinned to 144a65368fdd43df64690f60946a8b7c1a0bec69; PassWall2 access-control template fix pinned to 8d4fdd5.
            Management IP: 192.168.7.1
            Hostname: DulWiFi
            Wi-Fi: main only; JuLiangTk-5G channel 48, JuLiangTk-2.4G channel 9; password a1111111. Batch creation available in FastACL2.4.4.
            Included: custom JuLiang dashboard (no iStore/QuickStart), Argon, TTYD, LuCI tools, scheduled reboot, LuCI Statistics, PassWall 26.3.6-1, PassWall2 26.3.5-1, HomeProxy, OpenClash, luci-app-nps, and FastACL 1010V1 FastACL2.4.4. PassWall/PassWall2 stay installed for node storage/UI and manual fallback; the preserved uploaded 20WiFi ACL files are not activated while FastACL is enabled.
            Includes SK5/HTTP multiline import, Xray SOCKS mark fix, verified PassWall2 access-control page syntax fix, PassWall/PassWall2 actual exit-IP display, realtime-IP tools, PassWall2 SOCKS self-heal, WAN DHCP/MAC self-heal, and Argon realtime public IPv4/region display.
            October 10 DNS provider selection, custom and per-node DNS, compact gradient console and template fixes included. Batch limits: 14 additional 5GHz and 8 additional 2.4GHz, subject to actual driver capacity.
            Dedicated WiFi is created on demand in FastACL; no preset AP1-AP5.
            NPS client: source-feed nps/npc/luci-app-nps; first successful boot writes the uppercase physical WAN MAC without colons to vkey for nps.jontao.top:8024 TCP, compression and encryption enabled.
