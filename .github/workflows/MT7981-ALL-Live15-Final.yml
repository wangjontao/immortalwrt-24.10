name: JuLiang OS v1.5 MT7981 Full Series

on:
  workflow_dispatch:
  push:
    branches:
      - codex/live-1.5-egress-ip

permissions:
  contents: read

concurrency:
  group: juliang-os-v1.5-mt7981-all
  cancel-in-progress: false

env:
  PASSWALL2_TAG: 26.3.5-1
  PASSWALL_PACKAGES_COMMIT: 3e11c458c552aefd348232c627fd1ed9f8f08e41
  HOMEPROXY_COMMIT: edece28a0085f36d469ec82c8d45f562f602db53
  NPS_DOMAIN: nps.jontao.top

jobs:
  build:
    name: Build all MT7981 v1.5 images
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout final v1.5 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare runner and disk
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl jq openssl ccache zstd \
            squashfs-tools device-tree-compiler
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Ruby
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "SOURCE_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: juliang-v1.5-mt7981-all-${{ hashFiles('scripts/juliang-os-mt7981-v15.py', 'profiles/fastacl-v252/package-Makefile', '.github/workflows/MT7981-ALL-Live15-Final.yml') }}
          restore-keys: |
            juliang-v1.5-mt7981-all-

      - name: Configure feeds and application sources
        run: |
          set -euo pipefail
          cat >> feeds.conf.default <<FEEDS
          src-git lede_luci https://github.com/coolsnowwolf/luci.git^98d8a72ea2f55755c4608ef913867ff1d841889b
          FEEDS
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          rm -rf package/luci-app-passwall2 package/passwall-packages
          git clone --depth=1 --branch "$PASSWALL2_TAG" \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
            /tmp/openwrt-passwall2
          mv /tmp/openwrt-passwall2/luci-app-passwall2 package/
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/passwall-packages
          git -C package/passwall-packages checkout "$PASSWALL_PACKAGES_COMMIT"
          rm -rf package/passwall-packages/.git

          rm -rf package/homeproxy package/luci-app-homeproxy
          git clone https://github.com/immortalwrt/homeproxy.git package/homeproxy
          git -C package/homeproxy checkout "$HOMEPROXY_COMMIT"
          rm -rf package/homeproxy/.git

      - name: Prepare common JuLiang v1.5 overlay
        env:
          NPS_DOMAIN: nps.jontao.top
        run: |
          set -euo pipefail
          ./scripts/integrate-juliang-live13-sr503.sh

      - name: Configure all MT7981 targets
        run: |
          set -euo pipefail
          python3 scripts/juliang-os-mt7981-v15.py configure .config
          make defconfig
          python3 scripts/juliang-os-mt7981-v15.py verify-config .config
          python3 scripts/juliang-os-mt7981-v15.py list | tee MT7981-DEVICES.txt
          test "$(wc -l < MT7981-DEVICES.txt)" -gt 0

      - name: Seed U-Boot source from HTTPS mirror
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ ! -s dl/u-boot-2024.10.tar.bz2 ]; then
            curl -fL --retry 5 --retry-delay 2 \
              https://sources.openwrt.org/u-boot-2024.10.tar.bz2 \
              -o dl/u-boot-2024.10.tar.bz2
          fi
          echo "b28daf4ac17e43156363078bf510297584137f6df50fced9b12df34f61a92fb0  dl/u-boot-2024.10.tar.bz2" \
            | sha256sum -c -
          sha256sum dl/u-boot-2024.10.tar.bz2 \
            > dl/u-boot-2024.10.tar.bz2.hash

      - name: Download package sources
        run: |
          set -euo pipefail
          make download -j8 > download.log 2>&1 || {
            tail -200 download.log
            exit 1
          }

      - name: Build v1.5 MT7981 full series
        run: |
          set -euo pipefail
          make -j"$(nproc)" > build.log 2>&1 || {
            tail -250 build.log
            exit 1
          }

      - name: Collect firmware
        run: |
          set -euo pipefail
          rm -rf upload
          python3 scripts/juliang-os-mt7981-v15.py collect \
            bin/targets/mediatek/filogic upload
          cp MT7981-DEVICES.txt upload/
          cd upload
          sha256sum * > SHA256SUMS
          printf "Devices: " > BUILD-INFO.txt
          wc -l < MT7981-DEVICES.txt >> BUILD-INFO.txt
          printf "Source: %s\n" "$SOURCE_HASH" >> BUILD-INFO.txt
          printf "NPS: %s\n" "$NPS_DOMAIN" >> BUILD-INFO.txt
          cat BUILD-INFO.txt
          du -sh .
          find . -maxdepth 1 -type f -printf '%f\n' | sort | tail -30

      - name: Upload all firmware
        uses: actions/upload-artifact@v4
        with:
          name: JuLiang-OS-v1.5-MT7981-FULL-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
