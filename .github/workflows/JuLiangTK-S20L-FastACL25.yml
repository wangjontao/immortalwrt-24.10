name: JuLiangTK S20L FastACL 2.5 Development
permissions:
  contents: write
concurrency:
  group: juliangtk-s20l-fastacl25
  cancel-in-progress: false
jobs:
  validate:
    name: Device routing, subscriptions and UI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Check Linux line endings
      run: |
        python3 - <<'PY'
        from pathlib import Path
        files = list(Path('profiles/fastacl-v25').rglob('*')) + [Path('scripts/integrate-fastacl25-s20l.sh')]
        bad = [str(p) for p in files if p.is_file() and b'\r' in p.read_bytes()]
        if bad:
            raise SystemExit('Unexpected CR characters: ' + ', '.join(bad))
        PY
    - name: Install validation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 nftables iproute2 curl shfmt
        python3 -m venv .venv
        .venv/bin/pip install lupa PyYAML playwright
        .venv/bin/playwright install --with-deps chromium
        curl -fL --retry 3 -o /tmp/sing-box.tgz https://github.com/SagerNet/sing-box/releases/download/v1.12.25/sing-box-1.12.25-linux-amd64.tar.gz
        echo "a1ec76e2b6b139eb747a1b1ebee7d14b8d4be5a833596cad8070a31ef960301f  /tmp/sing-box.tgz" | sha256sum -c -
        mkdir -p /tmp/fastacl25-core
        tar -xzf /tmp/sing-box.tgz --strip-components=1 -C /tmp/fastacl25-core
    - name: Source and subscription tests
      run: |
        find profiles/fastacl-v25/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
        find profiles/fastacl-v25/root -type f | while read -r file; do if head -n1 "$file" | grep -q '^#!/bin/sh'; then shfmt -ln posix "$file" >/dev/null; fi; done
        shfmt -ln posix profiles/fastacl-v25/install.sh >/dev/null
        shfmt -ln posix scripts/integrate-fastacl25-s20l.sh >/dev/null
        .venv/bin/python profiles/fastacl-v25/tests/test_import.py
        .venv/bin/python profiles/fastacl-v25/tests/test_subscription.py
        .venv/bin/python profiles/fastacl-v25/tests/test_policy.py --fixtures profiles/fastacl-v25/test-results --sing-box /tmp/fastacl25-core/sing-box
    - name: Two devices on one LAN and fail-closed packet tests
      run: sudo .venv/bin/python profiles/fastacl-v25/tests/test_firewall.py /tmp/fastacl25-core/sing-box
    - name: Browser interaction tests
      run: .venv/bin/python profiles/fastacl-v25/tests/test_browser.py
    - name: Upload validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JuLiangTK-FastACL25-test-evidence
        path: profiles/fastacl-v25/test-results/*
        if-no-files-found: warn
        retention-days: 14
  build:
    name: JuLiangTK S20L 24.10 FastACL 2.5
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout forked ImmortalWrt source
      uses: actions/checkout@v4
    - name: Initialize build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full \
          patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils \
          re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone Asia/Shanghai
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
        echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
    - name: Install Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.x
        cache: false
    - name: Restore downloads and compiler cache
      uses: actions/cache@v4
      with:
        path: |
          dl
          .ccache
        key: juliangtk-s20l-fastacl25-${{ hashFiles('build-configs/JuLiangTK-S20L-FastACL25.txt', '.github/workflows/JuLiangTK-S20L-FastACL25.yml',
          'profiles/fastacl-v25/core-Makefile') }}
        restore-keys: |
          juliangtk-s20l-fastacl25-
          s20l-24.10-
    - name: Update feeds and add iStore
      run: |
        grep -q '^src-git istore ' feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
        grep -q '^src-git nas_packages ' feeds.conf.default || echo 'src-git nas_packages https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
        grep -q '^src-git nas_luci ' feeds.conf.default || echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds install -d y -p istore luci-app-store
        ./scripts/feeds install -d y -p nas_packages quickstart
        ./scripts/feeds install -d y -p nas_luci luci-app-quickstart
        ./scripts/feeds install -d y -p luci luci-app-autoreboot
    - name: Add source-feed NPS and Argon (no proxy plugins)
      run: |
        # Install the mutually compatible NPS packages supplied by this source.
        ./scripts/feeds install -f -p packages nps npc
        ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn
        NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f | head -n1)"
        test -n "$NPS_CONFIG_FILE"
        cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
        config nps
                option enabled '1'
                option server_addr '47.83.9.208'
                option server_port '8024'
                option protocol 'tcp'
                option compress '1'
                option crypt '1'
                option vkey 'WANMAC'
                option log_level '4'
        NPS_CONFIG

        rm -rf package/luci-theme-argon package/luci-app-argon-config
        git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
        git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
    - name: Integrate independent FastACL 2.5 and JuLiangTK S20L
      run: |
        mkdir -p package/base-files/files/usr/libexec
        mkdir -p package/base-files/files/etc/init.d
        mkdir -p package/base-files/files/etc/hotplug.d/iface
        cat > package/base-files/files/usr/libexec/nps-wan-mac <<'NPS_MAC'
        #!/bin/sh
        DONE=/etc/nps-wan-mac.done
        [ -e "$DONE" ] && exit 0
        [ -f /etc/config/nps ] && [ -x /etc/init.d/nps ] || exit 1

        sleep 5
        valid_mac() {
                case "$1" in ''|00:00:00:00:00:00|ff:ff:ff:ff:ff:ff) return 1;; ??:??:??:??:??:??) return 0;; *) return 1;; esac
        }
        get_wan_mac() {
                WAN_DEV="$(uci -q get network.wan.device)"
                WAN_DEV="${WAN_DEV#@}"
                [ -n "$WAN_DEV" ] || WAN_DEV="$(ip route 2>/dev/null | awk '/default/ {print $5; exit}')"
                case "$WAN_DEV" in pppoe-*) WAN_DEV="${WAN_DEV#pppoe-}";; esac
                WAN_MAC=""
                [ -n "$WAN_DEV" ] && [ -r "/sys/class/net/$WAN_DEV/address" ] && WAN_MAC="$(cat "/sys/class/net/$WAN_DEV/address")"
                valid_mac "$WAN_MAC" && return 0
                for LOWER in /sys/class/net/"$WAN_DEV"/lower_*; do
                        [ -r "$LOWER/address" ] || continue
                        WAN_MAC="$(cat "$LOWER/address")"
                        valid_mac "$WAN_MAC" && return 0
                done
                return 1
        }
        tries=0
        while [ "$tries" -lt 60 ]; do get_wan_mac && break; tries=$((tries + 1)); sleep 2; done
        valid_mac "$WAN_MAC" || { logger -t nps-wan-mac 'ERROR: physical WAN MAC not found'; exit 1; }
        NPS_KEY="$(printf '%s' "$WAN_MAC" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
        uci -q set nps.@nps[0].enabled='1'
        uci -q set nps.@nps[0].server_addr='47.83.9.208'
        uci -q set nps.@nps[0].server_port='8024'
        uci -q set nps.@nps[0].protocol='tcp'
        uci -q set nps.@nps[0].compress='1'
        uci -q set nps.@nps[0].crypt='1'
        uci -q set nps.@nps[0].vkey="$NPS_KEY"
        uci -q commit nps
        /etc/init.d/nps enable
        /etc/init.d/nps restart
        touch "$DONE"
        logger -t nps-wan-mac "NPS configured from physical WAN MAC $WAN_DEV"
        NPS_MAC

        cat > package/base-files/files/etc/init.d/nps-wan-mac <<'NPS_INIT'
        #!/bin/sh /etc/rc.common
        START=98
        STOP=10
        start() { [ -e /etc/nps-wan-mac.done ] || /usr/libexec/nps-wan-mac >/dev/null 2>&1 & }
        NPS_INIT

        cat > package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac <<'NPS_HOTPLUG'
        #!/bin/sh
        [ -e /etc/nps-wan-mac.done ] && exit 0
        [ "$INTERFACE" = 'wan' ] && [ "$ACTION" = 'ifup' ] && /usr/libexec/nps-wan-mac >/dev/null 2>&1 &
        NPS_HOTPLUG

        cat > package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac <<'NPS_DEFAULT'
        #!/bin/sh
        /etc/init.d/nps-wan-mac enable
        /etc/init.d/nps-wan-mac start
        exit 0
        NPS_DEFAULT

        chmod 0755 package/base-files/files/usr/libexec/nps-wan-mac
        chmod 0755 package/base-files/files/etc/init.d/nps-wan-mac
        chmod 0755 package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac
        chmod 0755 package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac


        sh scripts/integrate-fastacl25-s20l.sh
    - name: Download sources
      run: |
        make download -j"$(nproc)"
        find dl -type f -size -1024c -print -delete
    - name: Compile S20L firmware
      run: |
        # Rebuild the Go module cache after interrupted sing-box downloads.
        rm -rf dl/go-mod-cache
        mkdir -p dl/go-mod-cache
        make -j"$(nproc)" || make -j1 V=s
    - name: Verify and collect S20L firmware
      run: |
        mkdir -p upload
        mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname '*clx_s20l*sysupgrade*' -size +5M)
        if [ "${#images[@]}" -eq 0 ]; then
          echo 'ERROR: no CLX S20L sysupgrade image was produced.'
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          exit 1
        fi
        cp -a "${images[@]}" upload/
        mapfile -t manifests < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*clx_s20l*.manifest')
        [ "${#manifests[@]}" -gt 0 ] || { echo 'ERROR: S20L manifest missing'; exit 1; }
        for pkg in fastacl25 juliangtk-sing-box lyaml luci-app-store luci-app-quickstart luci-theme-argon luci-app-argon-config luci-app-ttyd luci-app-autoreboot nps luci-app-nps luci-i18n-nps-zh-cn npc; do
          grep -q "^$pkg " "${manifests[0]}" || { echo "ERROR: $pkg missing from firmware"; exit 1; }
        done
        if grep -Ei '^(luci-app-(passwall2?|homeproxy|openclash)|luci-i18n-(passwall2?|homeproxy|openclash)-)' "${manifests[0]}"; then
          echo 'Forbidden proxy plugin present in firmware'; exit 1
        fi
        cp .config upload/build.config
        for feed in feeds/*/.git; do test -e "$feed" || continue; git -C "${feed%/.git}" rev-parse HEAD; done > upload/feeds-commits.txt
        cp -a "${manifests[@]}" upload/
        find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
        cp JuLiangTK-S20L-final.config profiles/fastacl-v25/README.md upload/
        sha256sum upload/* | tee upload/SHA256SUMS
        ls -lh upload
    - name: Upload S20L firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: JuLiangTK-S20L-FastACL2.5.0-dev.1-${{ env.BUILD_DATE }}
        path: upload/*
        if-no-files-found: error
        retention-days: 30
    - name: Publish S20L firmware release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: JuLiangTK-S20L-FastACL2.5.0-dev.1-${{ env.BUILD_DATE }}
        name: JuLiangTK S20L FastACL 2.5 development ${{ env.BUILD_DATE }}
        files: upload/*
        body: |
          JuLiangTK S20L / MT7986A · ImmortalWrt 24.10 · FastACL 2.5.0-dev.1 development firmware
          Source commit: ${{ github.sha }}
          Management: 192.168.7.1; hostname JuLiangTK-S20L; SSH 20022.
          Main WiFi only: JuLiangTK on 2.4 GHz / 5 GHz, same LAN; key a1111111; channels 9 / 48.
          Device-only MAC/DHCP/IP assignment; shared native sing-box 1.12.25; SOCKS5/HTTP chain front selection.
          Airport subscriptions: HTTPS, links/Base64/Clash YAML/sing-box JSON; manual and scheduled updates, bound-node retention.
          Encrypted DNS default direct; advanced privacy follows device proxy; proxy IPv6 protected.
          Included: iStore, QuickStart, Argon, TTYD, common LuCI tools, scheduled reboot, Statistics, NPS/npc with physical WAN MAC key.
          Excluded: PassWall, PassWall2, HomeProxy, OpenClash; no multi-WiFi generator or wireless-to-node allocation.
          Hardware compatible/partitions remain clx,s20l. Cloud tests do not replace a real S20L cold boot and mobile-device test. Flash as a new configuration when testing this major version.
        prerelease: true
    needs: validate
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/fastacl25-juliangtk-s20l
    paths:
    - .github/workflows/JuLiangTK-S20L-FastACL25.yml
    - profiles/fastacl-v25/**
    - scripts/integrate-fastacl25-s20l.sh
    - build-configs/JuLiangTK-S20L-FastACL25.txt
