name: JuLiang OS RAX3000M (immortalwrt 24.10)

# Clean, self-contained recipe for the CMCC RAX3000M NAND on immortalwrt 24.10.
# Package set is taken from what the running router actually has installed, plus
# SQM. Anything else (iStore, QuickStart, PassWall 1, OpenClash, SSR+, samba,
# statistics, wol) is explicitly verified absent before a release is published.

on:
  push:
    branches: [juliang-imm24]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: juliang-imm24-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PASSWALL2_TAG: 26.3.5-1
  PWDEPS_COMMIT: 3e11c458c552aefd348232c627fd1ed9f8f08e41
  HOMEPROXY_COMMIT: edece28a0085f36d469ec82c8d45f562f602db53
  NPS_COMMIT: 480f2e502575641a0c9280d6fad971550621316d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build host
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl jq openssl ccache zstd libelf-dev
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M')" >> "$GITHUB_ENV"
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Verify the device is natively supported
        run: |
          DTS=target/linux/mediatek/dts/mt7981b-cmcc-rax3000m.dts
          test -s "$DTS"
          grep -q 'compatible = "cmcc,rax3000m", "mediatek,mt7981"' "$DTS"
          sed -n '/^define Device\/cmcc_rax3000m$/,/^endef$/p' target/linux/mediatek/image/filogic.mk \
            | grep -q 'IMAGE_SIZE := 116736k'

      - name: Feeds and application sources
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          git clone --depth=1 --branch "$PASSWALL2_TAG" \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/passwall2
          mv /tmp/passwall2/luci-app-passwall2 package/

          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git -C package/passwall-packages checkout "$PWDEPS_COMMIT"
          rm -rf package/passwall-packages/.git

          git clone https://github.com/immortalwrt/homeproxy.git package/homeproxy
          git -C package/homeproxy checkout "$HOMEPROXY_COMMIT"
          rm -rf package/homeproxy/.git

          git clone https://github.com/djylb/nps-openwrt.git /tmp/nps
          git -C /tmp/nps checkout "$NPS_COMMIT"
          cp -a /tmp/nps/npc package/

          git clone --depth=1 --filter=blob:none --sparse https://github.com/coolsnowwolf/luci.git /tmp/lean-luci
          git -C /tmp/lean-luci sparse-checkout set applications/luci-app-nps
          cp -a /tmp/lean-luci/applications/luci-app-nps package/
          sed -i 's#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#' package/luci-app-nps/Makefile

          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          rm -rf /tmp/passwall2 /tmp/nps /tmp/lean-luci

      - name: Configure
        run: |
          cat > .config <<'CFG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_UBIFS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-filetransfer=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-arpbind=y
          CONFIG_PACKAGE_luci-app-autoreboot=y

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_luci-app-nps=y
          CONFIG_PACKAGE_npc=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_tc-tiny=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-ifb=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CFG
          make defconfig

          # Root password and overlay sanity, all checked before the build starts.
          mkdir -p files/etc
          openssl passwd -1 '@password@' > files/etc/dulwifi-root.hash
          HASH="$(cat files/etc/dulwifi-root.hash)"
          cp package/base-files/files/etc/shadow files/etc/shadow
          sed -i "s#^root:[^:]*:#root:${HASH}:#" files/etc/shadow
          chmod 600 files/etc/shadow files/etc/dulwifi-root.hash
          chmod 755 files/etc/uci-defaults/90-juliang files/etc/init.d/juliang-wifi
          sh -n files/etc/uci-defaults/90-juliang
          sh -n files/etc/init.d/juliang-wifi
          grep -q 'set -e' files/etc/uci-defaults/90-juliang && { echo '90-juliang must not use set -e'; exit 1; } || true
          ./scripts/diffconfig.sh | tee JuLiang-RAX3000M.config

      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: juliang-imm24-dl-v1-${{ github.run_id }}
          restore-keys: |
            juliang-imm24-dl-v1-

      - name: Compile
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 3G
          ccache -z
          make download -j"$(nproc)" || true
          make -j"$(nproc)" || { df -h /; make -j1 V=s; }
          ccache -s

      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: juliang-imm24-dl-v1-${{ github.run_id }}

      - name: Verify the package set
        run: |
          set -eu
          MANIFEST=$(find bin/targets/mediatek/filogic -name '*cmcc_rax3000m*.manifest' | head -1)
          IMAGE=$(find bin/targets/mediatek/filogic -name '*cmcc_rax3000m*sysupgrade.bin' -size +5M | head -1)
          test -n "$MANIFEST"; test -n "$IMAGE"

          # Must be present.
          for p in luci-theme-argon luci-app-ttyd luci-app-passwall2 luci-app-homeproxy \
                   luci-app-nps npc luci-app-sqm sqm-scripts wpad-openssl firewall4 dnsmasq-full; do
            grep -q "^$p " "$MANIFEST" || { echo "MISSING: $p"; exit 1; }
          done

          # Must be absent: the packages that used to be forced in.
          for p in luci-app-store luci-app-quickstart quickstart taskd luci-app-passwall \
                   luci-app-openclash luci-app-ssr-plus luci-app-turboacc luci-app-vlmcsd \
                   luci-app-vsftpd luci-app-samba4 luci-app-wol; do
            if grep -q "^$p " "$MANIFEST"; then echo "UNWANTED: $p"; exit 1; fi
          done

          mkdir -p upload
          cp -a "$IMAGE" "$MANIFEST" JuLiang-RAX3000M.config upload/
          (cd upload && sha256sum * > SHA256SUMS)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: JuLiangOS-RAX3000M-${{ github.run_number }}
          name: JuLiang OS RAX3000M NAND ${{ env.BUILD_DATE }}
          files: upload/*
          body: |
            JuLiang OS for the CMCC RAX3000M NAND, built from immortalwrt 24.10.

            Management: http://192.168.7.1   root / @password@
            WiFi: JuLiang OS-2.4G, JuLiang OS-5G, Live-2.4G, Live-5G, passphrase 66668888
            Live network: 172.16.1.1/24, isolated from the LAN, NAT to the WAN
            Included: PassWall2, HomeProxy, NPS client, SQM (cake), Argon, TTYD, FileTransfer, UPnP
            Excluded and verified absent: iStore, QuickStart, PassWall 1, OpenClash, SSR+, samba, statistics, wol

            Flash from U-Boot or LuCI without keeping settings on first install.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JuLiangOS-RAX3000M-${{ github.run_number }}
          path: |
            upload/*
            .config
          if-no-files-found: warn
          retention-days: 30
