name: Publish FastACL online update
run-name: 'Publish FastACL 2.8.2 online update - ${{ inputs.channel }}'

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 2.8.2
        type: string
      channel:
        description: Update channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      run_ids:
        description: Comma-separated completed build run IDs
        required: true
        type: string
      notes_url:
        description: Optional release notes URL
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fastacl-online-publish-${{ inputs.version }}-${{ inputs.channel }}
  cancel-in-progress: false

env:
  RELEASE_DOMAIN: up.juliangtk.top:8443
  RELEASE_USER: fastacl-deploy
  RELEASE_HOST: 175.178.237.53
  RELEASE_ROOT: /srv/fastacl-releases

jobs:
  publish:
    name: Verify, sign and deploy update
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download completed build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -euo pipefail
          mkdir -p artifacts publish/releases
          for run_id in $(printf '%s' "$RUN_IDS" | tr ',' ' '); do
            test -n "$run_id"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "artifacts/run-$run_id"
          done
          find artifacts -type f -printf '%P\n' | sort | head -200

      - name: Stage sysupgrade images
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          release_dir="publish/releases/$version"
          mkdir -p "$release_dir"
          find artifacts -type f \
            \( -iname '*sysupgrade.bin' -o -iname '*sysupgrade.itb' \) \
            -print0 |
          while IFS= read -r -d '' image; do
            target="$release_dir/$(basename "$image")"
            if [ -e "$target" ]; then
              cmp -s "$image" "$target" || {
                echo "Conflicting duplicate image: $(basename "$image")" >&2
                exit 1
              }
            else
              cp "$image" "$target"
            fi
          done
          test "$(find "$release_dir" -type f | wc -l)" -gt 0
          (cd "$release_dir" && sha256sum ./* > SHA256SUMS)

      - name: Verify updater runtime in firmware manifests
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find artifacts -type f -name '*.manifest')
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            for package in fastacl252 usign jsonfilter; do
              grep -q "^${package} " "$manifest" || {
                echo "$manifest is missing $package" >&2
                exit 1
              }
            done
          done

      - name: Build OpenWrt usign verifier
        run: |
          set -euo pipefail
          git clone https://github.com/openwrt/usign.git /tmp/usign-src
          git -C /tmp/usign-src checkout f1f65026a94137c91b5466b149ef3ea3f20091e9
          cd /tmp/usign-src
          gcc -O2 -Wall --std=gnu99 -g3 -Wmissing-declarations \
            -o /tmp/usign ed25519.c edsign.c f25519.c fprime.c sha512.c main.c base64.c
          test -x /tmp/usign

      - name: Generate and sign manifest
        env:
          SIGNING_KEY: ${{ secrets.FASTACL_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          channel="${{ inputs.channel }}"
          test -n "$SIGNING_KEY"
          printf '%s\n' "$SIGNING_KEY" > /tmp/update-signing.key
          chmod 600 /tmp/update-signing.key
          python3 scripts/fastacl-update-manifest.py \
            --artifacts publish/releases \
            --models profiles/fastacl-v252/update-models.json \
            --output "publish/$channel.json" \
            --version "$version" \
            --channel "$channel" \
            --base-url "https://$RELEASE_DOMAIN" \
            --notes-url "${{ inputs.notes_url }}" \
            --source-runs "${{ inputs.run_ids }}" \
            --require-all \
            --usign /tmp/usign \
            --signing-key /tmp/update-signing.key
          /tmp/usign -V -m "publish/$channel.json" \
            -x "publish/$channel.json.sig" \
            -p profiles/fastacl-v252/root/etc/fastacl-upgrade/update.pub
          rm -f /tmp/update-signing.key

      - name: Deploy immutable release and update channel
        env:
          DEPLOY_KEY: ${{ secrets.FASTACL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FASTACL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          channel="${{ inputs.channel }}"
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/fastacl-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/fastacl-deploy ~/.ssh/known_hosts
          target="$RELEASE_USER@$RELEASE_HOST"
          ssh_options="-i $HOME/.ssh/fastacl-deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          if ssh $ssh_options "$target" "test -e '$RELEASE_ROOT/releases/$version'"; then
            echo "Release $version already exists and is immutable." >&2
            exit 1
          fi

          if ssh $ssh_options "$target" "test -e '$RELEASE_ROOT/staging/$version'"; then
            ssh $ssh_options "$target" \
              "chmod -R u+rwX '$RELEASE_ROOT/staging/$version' 2>/dev/null || true; rm -rf '$RELEASE_ROOT/staging/$version'"
          fi
          ssh $ssh_options "$target" "mkdir -p '$RELEASE_ROOT/staging/$version'"
          rsync -az --partial --info=progress2 --chmod=D755,F644 -e "ssh $ssh_options" \
            "publish/releases/$version/" \
            "$target:$RELEASE_ROOT/staging/$version/"
          ssh $ssh_options "$target" \
            "test -s '$RELEASE_ROOT/staging/$version/SHA256SUMS' && mv '$RELEASE_ROOT/staging/$version' '$RELEASE_ROOT/releases/$version'"

          rsync -az --partial --info=progress2 --chmod=D755,F644 -e "ssh $ssh_options" \
            "publish/$channel.json" "publish/$channel.json.sig" \
            "$target:$RELEASE_ROOT/staging/"
          ssh $ssh_options "$target" \
            "mv '$RELEASE_ROOT/staging/$channel.json' '$RELEASE_ROOT/$channel.json.tmp' && mv '$RELEASE_ROOT/staging/$channel.json.sig' '$RELEASE_ROOT/$channel.json.sig.tmp' && mv '$RELEASE_ROOT/$channel.json.tmp' '$RELEASE_ROOT/$channel.json' && mv '$RELEASE_ROOT/$channel.json.sig.tmp' '$RELEASE_ROOT/$channel.json.sig'"

          curl -fsS "https://$RELEASE_DOMAIN/$channel.json" |
            python3 -c "import json,sys; data=json.load(sys.stdin); assert data['version']=='$version'; assert data['channel']=='$channel'; print('Published', data['version'], 'with', len(data['models']), 'models')"

      - name: Publish summary
        run: |
          {
            echo "### FastACL online update published"
            echo ""
            echo "- Version: \`${{ inputs.version }}\`"
            echo "- Channel: \`${{ inputs.channel }}\`"
            echo "- Manifest: https://$RELEASE_DOMAIN/${{ inputs.channel }}.json"
            echo "- Build runs: \`${{ inputs.run_ids }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
