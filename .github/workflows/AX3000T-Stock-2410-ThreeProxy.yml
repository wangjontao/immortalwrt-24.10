name: JuLiang OS AX3000T Stock 24.10 PassWall2 SSR Plus OpenClash
run-name: 'JuLiang OS AX3000T Stock - PassWall2 GeoView - SSR AnyTLS via Sing-box - OpenClash Meta'
'on':
  workflow_dispatch: {}
  push:
    branches:
      - codex/ax3000t-stock-juliang-os
    paths:
      - ax3000t-stock-three-proxy/**
      - .github/workflows/AX3000T-Stock-2410-ThreeProxy.yml
permissions:
  contents: read
concurrency:
  group: ax3000t-stock-three-proxy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: AX3000T traditional U-Boot firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: 817ba5c0958c64fad5d067c330678892b90e716c
          path: openwrt
          persist-credentials: false
      - name: Install build and ARM64 validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-venv rsync unzip zlib1g-dev file wget curl ccache qemu-user lua5.1
          python3 -m venv openwrt/.venv
          openwrt/.venv/bin/pip install 'lupa==2.6'
      - name: Restore download and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: juliang-os-mt7981-threeproxy-${{ runner.os }}-${{ hashFiles('ax3000t-stock-three-proxy/sources.lock.json', 'ax3000t-stock-three-proxy/cores.lock.json') }}
          restore-keys: |
            juliang-os-mt7981-threeproxy-${{ runner.os }}-
      - name: Prepare pinned feeds and target configuration
        working-directory: openwrt
        run: |
          python3 ../ax3000t-stock-three-proxy/test_customization.py
          python3 ../ax3000t-stock-three-proxy/build.py prepare
          sh -n files/etc/uci-defaults/99-three-proxy-defaults
          sh -n files/etc/uci-defaults/98-juliang-admin
          luac5.1 -p files/usr/libexec/juliang-branding.lua
          luac5.1 -p files/usr/libexec/juliang-login-theme.lua
          luac5.1 -p files/usr/lib/lua/luci/controller/juliang_live.lua
          luac5.1 -p feeds/helloworld/luci-app-ssr-plus/root/usr/share/shadowsocksr/gen_config.lua
          luac5.1 -p package/custom-proxy-ui/luci-app-ssr-plus/root/usr/share/shadowsocksr/gen_singbox_anytls.lua
          luac5.1 -p package/custom-proxy-ui/luci-app-ssr-plus/root/usr/share/shadowsocksr/gen_singbox_anytls_server.lua
      - name: Verify official cores and Sing-box AnyTLS configuration
        working-directory: openwrt
        run: python3 ../ax3000t-stock-three-proxy/build.py corecheck
      - name: Download build sources
        working-directory: openwrt
        run: |
          make download -j8
      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j3 V=s 2>&1 | tee build.log
      - name: Check image and installed plugin manifest
        working-directory: openwrt
        run: python3 ../ax3000t-stock-three-proxy/build.py artifacts
      - name: Upload AX3000T traditional U-Boot firmware
        uses: actions/upload-artifact@v4
        with:
          name: JuLiang-OS-AX3000T-Stock-${{ github.run_id }}
          path: openwrt/upload/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JuLiang-OS-AX3000T-Stock-failure-${{ github.run_id }}
          path: |
            openwrt/build.log
            openwrt/logs/**
            openwrt/.config
            openwrt/tmp/.packageinfo
            openwrt/core-check/*.txt
            openwrt/core-check/*.json
          retention-days: 14
