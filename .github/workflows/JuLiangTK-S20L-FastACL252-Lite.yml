name: JuLiangTK S20L FastACL 2.5.2 Lite

'on':
  workflow_dispatch: {}
  push:
    branches:
      - codex/fastacl252-lite-fast
    paths:
      - .github/workflows/JuLiangTK-S20L-FastACL252-Lite.yml
      - profiles/fastacl-v252/**
      - scripts/integrate-fastacl252-s20l.sh
      - scripts/integrate-fastacl252-dependencies.sh
      - build-configs/JuLiangTK-S20L-FastACL252.txt

permissions:
  contents: write

concurrency:
  group: juliangtk-s20l-fastacl252-lite
  cancel-in-progress: true

jobs:
  preflight:
    name: Lite architecture and UI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 nftables iproute2 curl shfmt
          python3 -m venv .venv
          .venv/bin/pip install lupa PyYAML playwright
          .venv/bin/playwright install --with-deps chromium
          curl -fL --retry 3 -o /tmp/dae-amd64.tar.xz \
            https://github.com/daeuniverse/dae/releases/download/v2.1.1/dae-linux-x86_64.tar.xz
          echo 'c550af580dc97cc90986260da78c4bf72917f3213c2b5d8b79c45199d9c3dc90  /tmp/dae-amd64.tar.xz' | sha256sum -c -
          mkdir /tmp/dae-core
          tar -xJf /tmp/dae-amd64.tar.xz -C /tmp/dae-core
          install -m755 "$(find /tmp/dae-core -type f -name dae | head -n1)" /tmp/dae
      - name: Validate Lite hot path and syntax
        run: |
          python3 profiles/fastacl-v252/tests/test_lite_hotpath.py
          find profiles/fastacl-v252/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          find profiles/fastacl-v252/root -type f | while read -r file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then sh -n "$file"; shfmt -ln posix "$file" >/dev/null; fi
          done
          .venv/bin/python profiles/fastacl-v252/tests/test_import.py
          .venv/bin/python profiles/fastacl-v252/tests/test_subscription.py
      - name: Validate DNS relay and native nodes
        run: |
          (cd profiles/fastacl-v252/dns && go mod tidy && go test -race -timeout 2m ./... && go build -trimpath -o /tmp/fastacl252-dns .)
          .venv/bin/python profiles/fastacl-v252/tests/test_mihomo.py --core /tmp/dae --helper /tmp/fastacl252-dns
          for config in profiles/fastacl-v252/test-results/import-*.dae; do /tmp/dae validate -c "$config"; done
      - name: Validate quick-switch console in Chromium
        run: |
          cd profiles/fastacl-v252/tests
          ../../../.venv/bin/python test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastACL252-Lite-preflight-evidence
          path: profiles/fastacl-v252/test-results/*
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build JuLiangTK S20L Lite firmware
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          mkdir -p .ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Restore source and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: s20l-fastacl252-lite1-${{ hashFiles('build-configs/JuLiangTK-S20L-FastACL252.txt', 'profiles/fastacl-v252/package-Makefile', 'profiles/fastacl-v252/core-Makefile', 'profiles/fastacl-v252/dns/go.mod') }}
          restore-keys: |
            s20l-fastacl252-lite1-
            juliangtk-s20l-fastacl252-
            s20l-24.10-
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -f -p packages nps npc || true
          ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn luci-app-autoreboot || true
      - name: Add Argon and NPS defaults
        run: |
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f 2>/dev/null | head -n1)"
          if [ -n "$NPS_CONFIG_FILE" ]; then
            cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
          config nps
            option enabled '1'
            option server_addr 'nps.jontao.top'
            option server_port '8024'
            option protocol 'tcp'
            option compress '1'
            option crypt '1'
            option vkey 'WANMAC'
            option log_level '4'
          NPS_CONFIG
          fi
      - name: Integrate FastACL Lite
        run: |
          sh scripts/integrate-fastacl252-s20l.sh
          grep -q 'PKG_VERSION:=2.5.2-lite.1' package/fastacl252/Makefile
          grep -q "version='2.5.2-lite.1'" package/fastacl252/files/usr/lib/lua/luci/controller/fastacl252.lua
          grep -q "dae reload" package/fastacl252/files/usr/bin/fastacl252
          python3 profiles/fastacl-v252/tests/test_lite_hotpath.py
      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
      - name: Compile S20L firmware
        run: |
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" V=s
          kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
          make -j"$(nproc)" || make -j1 V=s
          kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
      - name: Verify and collect firmware
        run: |
          mkdir -p upload
          mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname '*clx_s20l*sysupgrade*' -size +5M)
          [ "${#images[@]}" -gt 0 ] || { echo 'ERROR: S20L sysupgrade image missing'; find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort; exit 1; }
          cp -a "${images[@]}" upload/
          mapfile -t manifests < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*clx_s20l*.manifest')
          [ "${#manifests[@]}" -gt 0 ] || { echo 'ERROR: S20L manifest missing'; exit 1; }
          for pkg in fastacl252 juliangtk-dae lyaml luci-theme-argon luci-app-argon-config luci-app-ttyd luci-app-autoreboot nps luci-app-nps npc; do
            grep -q "^$pkg " "${manifests[0]}" || { echo "ERROR: $pkg missing from firmware"; exit 1; }
          done
          if grep -Ei '^(luci-app-store|luci-app-quickstart|quickstart|taskd) ' "${manifests[0]}"; then echo 'ERROR: iStore/QuickStart unexpectedly present'; exit 1; fi
          if grep -Ei '^(luci-app-(passwall2?|homeproxy|openclash)|luci-i18n-(passwall2?|homeproxy|openclash)-)' "${manifests[0]}"; then echo 'ERROR: forbidden proxy plugin present'; exit 1; fi
          grep -q '2.5.2-lite.1' package/fastacl252/Makefile
          grep -q 'nps.jontao.top' package/fastacl252/files/usr/libexec/nps-wan-mac
          cp .config upload/build.config
          cp -a "${manifests[@]}" upload/
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
          cp JuLiangTK-S20L-final.config profiles/fastacl-v252/README.md upload/
          printf 'branch=%s\ncommit=%s\nversion=2.5.2-lite.1\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > upload/LITE-BUILD.txt
          sha256sum upload/* | tee upload/SHA256SUMS
          ls -lh upload
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JuLiangTK-S20L-FastACL2.5.2-Lite1-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: JuLiangTK-S20L-FastACL2.5.2-Lite1-${{ env.BUILD_DATE }}
          name: JuLiangTK S20L FastACL 2.5.2 Lite.1 ${{ env.BUILD_DATE }}
          body: |
            FastACL 2.5.2 Lite.1 for CLX S20L / MT7986.

            - dae/eBPF dataplane
            - application-layer hot node/preproxy/DNS switching
            - no network/WiFi/firewall reload for ordinary node changes
            - health-driven guardian instead of unconditional apply loop
            - protected batch node deletion and direct quick assignment
            - HOTFIX-5 Trojan/trojanc registration included
            - topology reload only for WiFi create/remove
          files: upload/*
          fail_on_unmatched_files: true
          make_latest: false
