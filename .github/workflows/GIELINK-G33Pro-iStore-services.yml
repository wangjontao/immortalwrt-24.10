name: GIELINK G33Pro v1 DulWiFi services

on:
  workflow_dispatch:
  push:
    branches:
      - jontaoNpS-gielink-g33pro-v1-dulwifi

permissions:
  contents: write

env:
  PASSWALL_TAG: 26.3.6-1
  PASSWALL2_TAG: 26.3.5-1
  PASSWALL_PACKAGES_COMMIT: 3e11c458c552aefd348232c627fd1ed9f8f08e41
  HOMEPROXY_COMMIT: edece28a0085f36d469ec82c8d45f562f602db53
  OPENCLASH_COMMIT: c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593
  NPS_COMMIT: 480f2e502575641a0c9280d6fad971550621316d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            openssl ccache zstd
          # GitHub's hosted image contains large SDKs that are unrelated to OpenWrt.
          # Removing them prevents target/install from exhausting the runner disk.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "SOURCE_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Restore download and compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: g33pro-openwrt-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            g33pro-openwrt-${{ runner.os }}-

      - name: Restore host and toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: g33pro-v2-host-toolchain-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            g33pro-v2-host-toolchain-${{ runner.os }}-

      - name: Restore target build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/target-*
            staging_dir/target-*
            bin/packages
          key: g33pro-v3-target-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            g33pro-v3-target-build-${{ runner.os }}-

      - name: Verify G33Pro MT7981 NAND/UBI layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dts = Path("target/linux/mediatek/dts/mt7981-gielink-g33pro-v1.dts").read_text()
          network = Path("target/linux/mediatek/filogic/base-files/etc/board.d/02_network").read_text()
          image = Path("target/linux/mediatek/image/filogic.mk").read_text()
          start = image.index("define Device/gielink_g33pro-v1")
          end = image.index("\nendef", start)
          profile = image[start:end]
          for value in (
              'compatible = "gielink,g33pro-v1", "gielink,g33pro", "mediatek,mt7981"',
              'mediatek,nmbm;', 'label = "ubi"', 'reg = <0x580000 0x7000000>;', '&wifi {',
              'compatible = "mediatek,mt7531";',
              'label = "wan";', 'label = "lan1";', 'label = "lan2";', 'label = "lan3";',
              'led-running = &status_green_led;', 'led-upgrade = &status_red_led;',
              'gpios = <&pio 10 GPIO_ACTIVE_HIGH>;',
              'gpios = <&pio 11 GPIO_ACTIVE_HIGH>;',
              'gpios = <&pio 12 GPIO_ACTIVE_HIGH>;',
              'port@0 {', 'port@1 {', 'port@2 {', 'port@3 {',
              'macaddr_factory_a0024:', 'macaddr_factory_a002a:'
          ):
              assert value in dts, f"DTS validation missing: {value}"
          assert 'compatible = "generic,nmbm"' not in dts
          assert '&hnat {' not in dts
          assert 'ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" wan' in network
          assert 'gmac1: mac@1' not in dts
          assert 'phy-handle = <&int_gbe_phy>;' not in dts
          for value in ('IMAGE_SIZE := 113152k', 'KERNEL_IN_UBI := 1',
                        'IMAGE/factory.bin := append-ubi',
                        'ARTIFACTS := preloader.bin bl31-uboot.fip',
                        'ARTIFACT/preloader.bin := mt7981-bl2 spim-nand-ddr3',
                        'ARTIFACT/bl31-uboot.fip := mt7981-bl31-uboot gielink_g33pro-v1',
                        '$(DEVICE_DTS)', '$(IMAGE_SIZE)'):
              assert value in profile, f"image profile validation missing: {value}"
          assert 'TARGET_DEVICES += gielink_g33pro-v1' in image
          print('Verified G33Pro Q30Pro-style port0 WAN + port1/2/3 LAN mapping, 110M-class UBI, factory MACs and image rules.')
          PY

      - name: Update feeds and add application sources
        run: |
          cat >> feeds.conf.default <<'FEEDS'
          src-git istore https://github.com/linkease/istore.git;main
          src-git nas_packages https://github.com/linkease/nas-packages.git;master
          src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main
          FEEDS
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store
          ./scripts/feeds install -d y -p nas_packages quickstart
          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

          rm -rf package/luci-app-passwall package/luci-app-passwall2 package/passwall-packages
          git clone --depth=1 --branch "$PASSWALL_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/passwall
          mv /tmp/passwall/luci-app-passwall package/
          git clone --depth=1 --branch "$PASSWALL2_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/passwall2
          mv /tmp/passwall2/luci-app-passwall2 package/
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git -C package/passwall-packages checkout "$PASSWALL_PACKAGES_COMMIT"
          rm -rf package/passwall-packages/.git

          rm -rf package/homeproxy package/luci-app-homeproxy
          git clone https://github.com/immortalwrt/homeproxy.git package/homeproxy
          git -C package/homeproxy checkout "$HOMEPROXY_COMMIT"
          rm -rf package/homeproxy/.git

          rm -rf package/luci-app-openclash
          curl -fL --retry 8 --retry-all-errors --connect-timeout 20 \
            "https://codeload.github.com/vernesong/OpenClash/tar.gz/$OPENCLASH_COMMIT" \
            -o /tmp/openclash.tar.gz
          mkdir -p /tmp/openclash
          tar -xzf /tmp/openclash.tar.gz --strip-components=1 -C /tmp/openclash
          cp -a /tmp/openclash/luci-app-openclash package/

          rm -rf package/npc package/luci-app-nps package/luci-app-npc
          git clone https://github.com/djylb/nps-openwrt.git /tmp/nps
          git -C /tmp/nps checkout "$NPS_COMMIT"
          cp -a /tmp/nps/npc package/
          git clone --depth=1 --filter=blob:none --sparse https://github.com/coolsnowwolf/luci.git /tmp/lean-luci
          git -C /tmp/lean-luci sparse-checkout set applications/luci-app-nps
          cp -a /tmp/lean-luci/applications/luci-app-nps package/
          sed -i 's#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#' package/luci-app-nps/Makefile
          # npc is selected explicitly in .config; avoid luci-app-nps <-> npc Kconfig recursion.
          sed -i 's/^LUCI_DEPENDS:=+wget +npc$/LUCI_DEPENDS:=+wget/' package/luci-app-nps/Makefile

          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

          rm -rf feeds/nas_packages/network/services/librespeed-cli \
            feeds/nas_packages/network/services/librespeed-cli-rust \
            feeds/nas_packages/libs/librespeed-common
          rm -rf package/feeds/nas_packages/librespeed-cli \
            package/feeds/nas_packages/librespeed-cli-rust \
            package/feeds/nas_packages/librespeed-common
          rm -rf tmp

      - name: Configure G33Pro DulWiFi and first-boot defaults
        run: |
          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_gielink_g33pro-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_quickstart=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_npc=y
          CONFIG_PACKAGE_luci-app-nps=y
          # CONFIG_PACKAGE_luci-app-npc is not set
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_CCACHE=y
          CONFIG
          make defconfig

          echo "===== Selected target device ====="
          grep '^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y' .config || true
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_gielink_g33pro-v1=y' .config || {
            echo "ERROR: GIELINK G33Pro v1 target was not selected!"
            exit 1
          }

          mkdir -p files/etc
          openssl passwd -1 password > files/etc/dulwifi-root.hash
          cp package/base-files/files/etc/shadow files/etc/shadow
          HASH="$(cat files/etc/dulwifi-root.hash)"
          sed -i "s#^root:[^:]*:#root:${HASH}:#" files/etc/shadow
          chmod 600 files/etc/shadow files/etc/dulwifi-root.hash
          chmod 755 files/etc/uci-defaults/99-zz-dulwifi files/etc/init.d/dulwifi-firstboot files/usr/libexec/dulwifi-firstboot
          sh -n files/etc/uci-defaults/99-zz-dulwifi
          sh -n files/usr/libexec/dulwifi-firstboot

          for symbol in CONFIG_PACKAGE_luci-app-store CONFIG_PACKAGE_luci-app-quickstart \
            CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_luci-app-ttyd \
            CONFIG_PACKAGE_luci-app-passwall CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_luci-app-homeproxy CONFIG_PACKAGE_luci-app-openclash \
            CONFIG_PACKAGE_luci-app-nps CONFIG_PACKAGE_npc; do
            grep -qx "$symbol=y" .config || { echo "ERROR: $symbol missing"; exit 1; }
          done
          ./scripts/diffconfig.sh | tee GIELINK-G33Pro-v1-final.config

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
          rm -rf feeds/*/.git package/*/.git package/*/*/.git
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          df -h /

      - name: Prepare OpenWrt host tools and toolchain
        id: host_toolchain
        run: |
          echo "Preparing OpenWrt host tools before target/linux preflight..."
          make tools/install -j"$(nproc)" || { df -h /; make tools/install -j1 V=s; exit 1; }
          make toolchain/install -j"$(nproc)" || { df -h /; make toolchain/install -j1 V=s; exit 1; }
          test -x staging_dir/host/bin/m4
          staging_dir/host/bin/m4 --version | head -n 1
          df -h /

      - name: Preflight target linux
        id: preflight
        run: |
          echo "Preflight target/linux compile before the long package build..."
          make target/linux/compile -j"$(nproc)" || {
            df -h /
            make target/linux/compile -j1 V=s
            exit 1
          }
          KERNEL_MT7530="$(find build_dir/target-*/linux-mediatek_filogic/linux-6.6*/drivers/net/dsa/mt7530.c -type f | head -n1)"
          if [ -z "$KERNEL_MT7530" ]; then
            echo "ERROR: prepared mt7530.c was not found after target/linux compile"
            exit 1
          fi
          if ! grep -A3 'irq = irq_find_mapping(priv->irq_domain, p);' "$KERNEL_MT7530" | grep -q 'if (irq)'; then
            echo "ERROR: MT7530 unmapped-IRQ guard patch was not applied"
            exit 1
          fi
          echo "Verified MT7530 unmapped-IRQ guard in prepared kernel source."
          echo "target/linux compile passed. Image DTB is generated later during the full image build."

      - name: Compile firmware
        id: compile
        run: |
          df -h /
          if ! make -j"$(nproc)"; then
            echo "Parallel build failed; retrying serially with verbose output..."
            df -h /
            make -j1 V=s
          fi

      - name: Save download and compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            .ccache
          key: g33pro-openwrt-${{ runner.os }}-${{ github.sha }}

      - name: Save host and toolchain cache
        if: ${{ always() && steps.host_toolchain.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: g33pro-v2-host-toolchain-${{ runner.os }}-${{ github.sha }}

      - name: Save target build cache
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.compile.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/target-*
            staging_dir/target-*
            bin/packages
          key: g33pro-v3-target-build-${{ runner.os }}-${{ github.sha }}

      - name: Verify and collect
        run: |
          mkdir -p upload
          mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f \( -iname '*gielink_g33pro-v1*factory.bin' -o -iname '*gielink_g33pro-v1*sysupgrade.bin' \) -size +5M)
          [ "${#images[@]}" -gt 0 ]
          mapfile -t boot_artifacts < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f \( -iname '*gielink_g33pro-v1*preloader.bin' -o -iname '*gielink_g33pro-v1*bl31-uboot.fip' \))
          [ "${#boot_artifacts[@]}" -ge 2 ] || { echo "ERROR: G33Pro preloader/FIP artifacts missing"; find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f\n'; exit 1; }
          mapfile -t manifests < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname '*gielink_g33pro-v1*.manifest')
          [ "${#manifests[@]}" -gt 0 ]
          for package in luci-app-store luci-app-quickstart luci-theme-argon luci-app-ttyd \
            luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-nps npc; do
            grep -q "^${package} " "${manifests[0]}" || { echo "ERROR: ${package} missing"; exit 1; }
          done
          cp -a "${images[@]}" "${boot_artifacts[@]}" "${manifests[@]}" GIELINK-G33Pro-v1-final.config upload/
          sha256sum upload/* | tee upload/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIELINK-G33Pro-v1-DulWiFi-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: GIELINK-G33Pro-v1-DulWiFi-${{ env.BUILD_DATE }}
          name: GIELINK G33Pro v1 DulWiFi ${{ env.BUILD_DATE }}
          files: upload/*
          body: |
            GIELINK G33Pro v1 / MT7981B / Q30Pro-style 112 MiB raw UBI layout (~110 MiB usable), port0 WAN + port1/2/3 LAN1/LAN2/LAN3.
            Management: http://192.168.9.1; root password: password.
            WiFi: DulWiFi-2.4G and DulWiFi-5G; password: a1111111.
            Includes iStore, QuickStart, Argon, TTYD, PassWall, PassWall2, HomeProxy, OpenClash and luci-app-nps.
            NPS server: 47.83.9.208:8024; first boot writes the uppercase physical WAN MAC without colons to vkey.
