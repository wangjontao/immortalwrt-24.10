name: GIELINK G33Pro iStore services

on:
  workflow_dispatch:
  push:
    branches: [jontaoNpS-gielink-g33pro-v1]

permissions:
  contents: write

env:
  PASSWALL_TAG: 26.3.6-1
  PASSWALL2_TAG: 26.3.5-1
  NPS_COMMIT: 480f2e502575641a0c9280d6fad971550621316d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq openssl ccache zstd
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby
      - uses: actions/setup-go@v5
        with: {go-version: 1.24.x, cache: false}
      - name: Add feeds and applications
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git istore https://github.com/linkease/istore.git;main
          src-git nas_packages https://github.com/linkease/nas-packages.git;master
          src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store
          ./scripts/feeds install -d y -p nas_packages quickstart
          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart
          git clone --depth=1 --branch "$PASSWALL_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/pw
          git clone --depth=1 --branch "$PASSWALL2_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/pw2
          cp -a /tmp/pw/luci-app-passwall /tmp/pw2/luci-app-passwall2 package/
          git clone https://github.com/djylb/nps-openwrt.git /tmp/nps
          git -C /tmp/nps checkout "$NPS_COMMIT"
          cp -a /tmp/nps/npc package/
          git clone --depth=1 --filter=blob:none --sparse https://github.com/coolsnowwolf/luci.git /tmp/luci
          git -C /tmp/luci sparse-checkout set applications/luci-app-nps
          cp -a /tmp/luci/applications/luci-app-nps package/
          sed -i 's#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#' package/luci-app-nps/Makefile
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
      - name: Configure G33Pro defaults
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_gielink_g33pro_v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_quickstart=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-nps=y
          CONFIG_PACKAGE_npc=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_dnsmasq-full=y
          EOF
          make defconfig
          mkdir -p files/etc
          openssl passwd -1 password > files/etc/dulwifi-root.hash
          cp package/base-files/files/etc/shadow files/etc/shadow
          HASH=$$(cat files/etc/dulwifi-root.hash)
          sed -i "s#^root:[^:]*:#root:$${HASH}:#" files/etc/shadow
          mkdir -p upload
      - name: Build
        run: |
          make download -j$$(nproc)
          find dl -type f -size -1024c -delete
          make -j$$(nproc) || make -j1 V=s
      - name: Collect and publish
        run: |
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname '*gielink_g33pro-v1*' -size +5M -exec cp {} upload/ \;
          cp bin/targets/mediatek/filogic/*.manifest upload/ 2>/dev/null || true
          sha256sum upload/* | tee upload/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: GIELINK-G33Pro-v1-${{ github.run_number }}
          path: upload/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: GIELINK-G33Pro-v1-${{ github.run_number }}
          name: GIELINK G33Pro v1 DulWiFi build ${{ github.run_number }}
          files: upload/*
          body: GIELINK G33Pro v1 / MT7981 / 114 MiB UBI. Includes the usual LuCI, iStore, QuickStart, Argon, TTYD, PassWall, PassWall2, HomeProxy, OpenClash and NPS packages.
