name: FastACL 2.5.2 dae dependency audit

'on':
  push:
    branches:
      - codex/fastacl252-dae-s20l
    paths:
      - profiles/fastacl-v252/**
      - scripts/integrate-fastacl252-dependencies.sh
      - scripts/integrate-fastacl252-s20l.sh
      - build-configs/JuLiangTK-S20L-FastACL252.txt
      - .github/workflows/FastACL252-dae-dependencies.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and Linux line endings
        run: |
          sh -n scripts/integrate-fastacl252-dependencies.sh
          sh -n scripts/integrate-fastacl252-s20l.sh
          sh -n profiles/fastacl-v252/check-kernel.sh
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('profiles/fastacl-v252').rglob('*'))+[Path('scripts/integrate-fastacl252-dependencies.sh'),Path('scripts/integrate-fastacl252-s20l.sh'),Path('build-configs/JuLiangTK-S20L-FastACL252.txt')]
          bad=[str(p) for p in files if p.is_file() and b'\r' in p.read_bytes()]
          assert not bad,bad
          PY
      - name: Verify pinned upstream ARM64 archive
        run: |
          curl -fL --retry 3 -o /tmp/dae.tar.xz https://github.com/daeuniverse/dae/releases/download/v2.1.1/dae-linux-arm64.tar.xz
          echo 'bd84b6770cb335b8a45d8b1e16a95f68cf940b3edaaeeb449c187ce4b1058d0b  /tmp/dae.tar.xz' | sha256sum -c -
          mkdir /tmp/dae-archive
          tar -xJf /tmp/dae.tar.xz -C /tmp/dae-archive
          mapfile -t binaries < <(find /tmp/dae-archive -type f -name dae)
          test "${#binaries[@]}" -eq 1
          readelf -h "${binaries[0]}" | grep -q 'Machine:.*AArch64'
          if readelf -l "${binaries[0]}" | grep -q INTERP; then echo 'Dynamic executable needs additional libc review'; exit 1; fi
      - name: Verify dev.2 dependency selection
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/juliangtk-dae
          cp profiles/fastacl-v252/core-Makefile package/juliangtk-dae/Makefile
          cp build-configs/JuLiangTK-S20L-FastACL252.txt .config
          sh scripts/integrate-fastacl252-dependencies.sh
          grep -q '^CONFIG_PACKAGE_juliangtk-dae=y$' .config
          if grep -E '^CONFIG_PACKAGE_(luci-app-store|luci-app-quickstart|quickstart|taskd)=y$' .config; then echo 'iStore/QuickStart selected unexpectedly'; exit 1; fi
          ./scripts/diffconfig.sh > /tmp/dae-dependency.config
      - uses: actions/upload-artifact@v4
        with:
          name: FastACL252-dae-dependency-selection
          path: /tmp/dae-dependency.config
          if-no-files-found: error
