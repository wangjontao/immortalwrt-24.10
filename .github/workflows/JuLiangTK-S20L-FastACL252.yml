name: JuLiangTK S20L FastACL 2.5.2 dae Development

'on':
  workflow_dispatch: {}
  push:
    branches:
      - codex/fastacl252-dae-s20l
    paths:
      - .github/workflows/JuLiangTK-S20L-FastACL252.yml
      - profiles/fastacl-v252/**
      - scripts/integrate-fastacl252-s20l.sh
      - scripts/integrate-fastacl252-dependencies.sh
      - build-configs/JuLiangTK-S20L-FastACL252.txt

permissions:
  contents: write

concurrency:
  group: juliangtk-s20l-fastacl252-dae
  cancel-in-progress: true

jobs:
  validate:
    name: Actual dae/eBPF, DNS, WiFi, imports and console
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 nftables iproute2 curl shfmt tcpdump
          python3 -m venv .venv
          .venv/bin/pip install lupa PyYAML playwright
          .venv/bin/playwright install --with-deps chromium
          curl -fL --retry 3 -o /tmp/dae-amd64.tar.xz https://github.com/daeuniverse/dae/releases/download/v2.1.1/dae-linux-x86_64.tar.xz
          echo 'c550af580dc97cc90986260da78c4bf72917f3213c2b5d8b79c45199d9c3dc90  /tmp/dae-amd64.tar.xz' | sha256sum -c -
          mkdir /tmp/dae-core
          tar -xJf /tmp/dae-amd64.tar.xz -C /tmp/dae-core
          binary=$(find /tmp/dae-core -type f -name dae)
          install -m755 "$binary" /tmp/dae
      - name: Source, DNS and native-node validation
        run: |
          find profiles/fastacl-v252/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          find profiles/fastacl-v252/root -type f | while read -r file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then shfmt -ln posix "$file" >/dev/null; fi
          done
          .venv/bin/python profiles/fastacl-v252/tests/test_import.py
          .venv/bin/python profiles/fastacl-v252/tests/test_subscription.py
          (cd profiles/fastacl-v252/dns && go mod tidy && go test -race -timeout 2m ./... && go build -o /tmp/fastacl252-dns .)
          .venv/bin/python profiles/fastacl-v252/tests/test_mihomo.py --core /tmp/dae --helper /tmp/fastacl252-dns
          for config in profiles/fastacl-v252/test-results/import-*.dae; do /tmp/dae validate -c "$config"; done
      - name: Real eBPF routing and core-failure protection
        run: sudo .venv/bin/python profiles/fastacl-v252/tests/test_firewall.py /tmp/dae
      - name: Responsive console interaction tests
        if: ${{ !cancelled() }}
        run: .venv/bin/python profiles/fastacl-v252/tests/test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastACL252-dae-test-evidence
          path: profiles/fastacl-v252/test-results/*
          if-no-files-found: warn
          retention-days: 14

  build:
    name: JuLiangTK S20L 24.10 FastACL 2.5.2 dae
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout forked ImmortalWrt source
        uses: actions/checkout@v4
      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Restore downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: juliangtk-s20l-fastacl252-dev2-${{ hashFiles('build-configs/JuLiangTK-S20L-FastACL252.txt', '.github/workflows/JuLiangTK-S20L-FastACL252.yml', 'profiles/fastacl-v252/core-Makefile') }}
          restore-keys: |
            juliangtk-s20l-fastacl252-dev2-
            juliangtk-s20l-fastacl252-
            s20l-24.10-
      - name: Update standard feeds (no iStore / QuickStart feeds)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -f -p packages nps npc
          ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn luci-app-autoreboot
      - name: Add NPS domain defaults and Argon
        run: |
          NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f | head -n1)"
          test -n "$NPS_CONFIG_FILE"
          cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
          config nps
            option enabled '1'
            option server_addr 'nps.jontao.top'
            option server_port '8024'
            option protocol 'tcp'
            option compress '1'
            option crypt '1'
            option vkey 'WANMAC'
            option log_level '4'
          NPS_CONFIG
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
      - name: Install WAN-MAC NPS helper and integrate FastACL dev.2
        run: |
          mkdir -p package/base-files/files/usr/libexec package/base-files/files/etc/init.d package/base-files/files/etc/hotplug.d/iface package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/usr/libexec/nps-wan-mac <<'NPS_MAC'
          #!/bin/sh
          DONE=/etc/nps-wan-mac.done
          [ -e "$DONE" ] && exit 0
          [ -f /etc/config/nps ] && [ -x /etc/init.d/nps ] || exit 1
          sleep 5
          valid_mac() {
            case "$1" in ''|00:00:00:00:00:00|ff:ff:ff:ff:ff:ff) return 1;; ??:??:??:??:??:??) return 0;; *) return 1;; esac
          }
          get_wan_mac() {
            WAN_DEV="$(uci -q get network.wan.device)"
            WAN_DEV="${WAN_DEV#@}"
            [ -n "$WAN_DEV" ] || WAN_DEV="$(ip route 2>/dev/null | awk '/default/ {print $5; exit}')"
            case "$WAN_DEV" in pppoe-*) WAN_DEV="${WAN_DEV#pppoe-}";; esac
            WAN_MAC=""
            [ -n "$WAN_DEV" ] && [ -r "/sys/class/net/$WAN_DEV/address" ] && WAN_MAC="$(cat "/sys/class/net/$WAN_DEV/address")"
            valid_mac "$WAN_MAC" && return 0
            for LOWER in /sys/class/net/"$WAN_DEV"/lower_*; do
              [ -r "$LOWER/address" ] || continue
              WAN_MAC="$(cat "$LOWER/address")"
              valid_mac "$WAN_MAC" && return 0
            done
            return 1
          }
          tries=0
          while [ "$tries" -lt 60 ]; do get_wan_mac && break; tries=$((tries + 1)); sleep 2; done
          valid_mac "$WAN_MAC" || { logger -t nps-wan-mac 'ERROR: physical WAN MAC not found'; exit 1; }
          NPS_KEY="$(printf '%s' "$WAN_MAC" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          uci -q set nps.@nps[0].enabled='1'
          uci -q set nps.@nps[0].server_addr='nps.jontao.top'
          uci -q set nps.@nps[0].server_port='8024'
          uci -q set nps.@nps[0].protocol='tcp'
          uci -q set nps.@nps[0].compress='1'
          uci -q set nps.@nps[0].crypt='1'
          uci -q set nps.@nps[0].vkey="$NPS_KEY"
          uci -q commit nps
          /etc/init.d/nps enable
          /etc/init.d/nps restart
          touch "$DONE"
          logger -t nps-wan-mac "NPS configured from physical WAN MAC $WAN_DEV"
          NPS_MAC
          cat > package/base-files/files/etc/init.d/nps-wan-mac <<'NPS_INIT'
          #!/bin/sh /etc/rc.common
          START=98
          STOP=10
          start() { [ -e /etc/nps-wan-mac.done ] || /usr/libexec/nps-wan-mac >/dev/null 2>&1 & }
          NPS_INIT
          cat > package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac <<'NPS_HOTPLUG'
          #!/bin/sh
          [ -e /etc/nps-wan-mac.done ] && exit 0
          [ "$INTERFACE" = 'wan' ] && [ "$ACTION" = 'ifup' ] && /usr/libexec/nps-wan-mac >/dev/null 2>&1 &
          NPS_HOTPLUG
          cat > package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac <<'NPS_DEFAULT'
          #!/bin/sh
          /etc/init.d/nps-wan-mac enable
          /etc/init.d/nps-wan-mac start
          exit 0
          NPS_DEFAULT
          chmod 0755 package/base-files/files/usr/libexec/nps-wan-mac package/base-files/files/etc/init.d/nps-wan-mac package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac
          sh scripts/integrate-fastacl252-s20l.sh
      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
      - name: Compile S20L firmware
        run: |
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          staging_dir/host/bin/m4 --version
          make target/linux/compile -j"$(nproc)" V=s
          kernel=$(find build_dir/target-* -path "*/linux-mediatek_filogic/linux-6.6*/.config" | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
          make -j"$(nproc)" || make -j1 V=s
          kernel=$(find build_dir/target-* -path "*/linux-mediatek_filogic/linux-6.6*/.config" | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
      - name: Verify and collect S20L firmware
        run: |
          mkdir -p upload
          mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname '*clx_s20l*sysupgrade*' -size +5M)
          if [ "${#images[@]}" -eq 0 ]; then
            echo 'ERROR: no CLX S20L sysupgrade image was produced.'
            find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            exit 1
          fi
          cp -a "${images[@]}" upload/
          mapfile -t manifests < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*clx_s20l*.manifest')
          [ "${#manifests[@]}" -gt 0 ] || { echo 'ERROR: S20L manifest missing'; exit 1; }
          for pkg in fastacl252 juliangtk-dae lyaml luci-theme-argon luci-app-argon-config luci-app-ttyd luci-app-autoreboot nps luci-app-nps luci-i18n-nps-zh-cn npc; do
            grep -q "^$pkg " "${manifests[0]}" || { echo "ERROR: $pkg missing from firmware"; exit 1; }
          done
          if grep -Ei '^(luci-app-store|luci-app-quickstart|quickstart|taskd) ' "${manifests[0]}"; then echo 'ERROR: iStore/QuickStart unexpectedly present'; exit 1; fi
          if grep -Ei '^(luci-app-(passwall2?|homeproxy|openclash)|luci-i18n-(passwall2?|homeproxy|openclash)-)' "${manifests[0]}"; then echo 'ERROR: forbidden proxy plugin present'; exit 1; fi
          grep -R "2.5.2-dev.2" profiles/fastacl-v252/root profiles/fastacl-v252/package-Makefile >/dev/null
          grep -R "nps.jontao.top" package/base-files/files/usr/libexec/nps-wan-mac >/dev/null
          cp .config upload/build.config
          for feed in feeds/*/.git; do test -e "$feed" || continue; git -C "${feed%/.git}" rev-parse HEAD; done > upload/feeds-commits.txt
          cp -a "${manifests[@]}" upload/
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
          cp JuLiangTK-S20L-final.config profiles/fastacl-v252/README.md upload/
          sha256sum upload/* | tee upload/SHA256SUMS
          ls -lh upload
      - name: Upload S20L firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JuLiangTK-S20L-FastACL2.5.2-dev.2-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish S20L firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: JuLiangTK-S20L-FastACL2.5.2-dev.2-${{ env.BUILD_DATE }}
          name: JuLiangTK S20L FastACL 2.5.2 dev.2 dae ${{ env.BUILD_DATE }}
          files: upload/*
          prerelease: true
          body: |
            JuLiangTK S20L / MT7986A · ImmortalWrt 24.10 · FastACL 2.5.2-dev.2 dae/eBPF.
            Source commit: ${{ github.sha }}
            Management: 192.168.7.1; hostname JuLiangTK-S20L; SSH 20022.
            JuLiang control center included; iStore and QuickStart removed.
            Main WiFi stays device-level; optional managed WiFi supports up to +14 5GHz and +8 2.4GHz with independent 172.16.x.0/24 networks.
            DNS providers and per-device/per-WiFi custom DNS are included; proxy DNS follows its assigned exit using DoH.
            NPS server: nps.jontao.top:8024; VKey derives from uppercase physical WAN MAC.
            PassWall/PassWall2/HomeProxy/OpenClash are not included.
