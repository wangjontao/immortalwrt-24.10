name: AX3000T U-Boot Dual-Key Cross Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ax3000t-uboot-build
    paths:
      - .github/workflows/AX3000T-Uboot-Dualbutton-Build.yml

permissions:
  contents: read

jobs:
  build:
    name: AX3000T ${{ matrix.label }} U-Boot
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiaomi_ax3000t
            label: standard
          - board: xiaomi_ax3000t-an8855
            label: an8855

    steps:
      - name: Checkout U-Boot source
        uses: actions/checkout@v4
        with:
          repository: wangjontao/bl-mt798x-dhcpd
          ref: codex/ax3000t-ubootmod-dualbutton
          path: uboot-src
          persist-credentials: false

      - name: Install build dependencies
        working-directory: uboot-src
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $(cat depends/ubuntu-22.04) rename tar

      - name: Build FIP and BL2
        working-directory: uboot-src
        env:
          SOC: mt7981
          VERSION: "2025"
          VARIANT: ubootmod
          FSTHEME: bootstrap
          COPY_BL2: "1"
          SILENT: "Y"
        run: make build BOARD="${{ matrix.board }}"

      - name: Collect artifacts
        working-directory: uboot-src
        run: |
          set -euo pipefail
          mkdir -p upload
          cp output/* upload/
          find upload -maxdepth 1 -type f -print0 | xargs -0 sha256sum > upload/SHA256SUMS
          ls -lh upload

      - name: Upload U-Boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-ubootmod-${{ matrix.label }}-dualbutton-${{ github.run_id }}
          path: uboot-src/upload/*
          if-no-files-found: error
          retention-days: 30
